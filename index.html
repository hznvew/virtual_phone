let camStream=null,camFacing='environment';
async function camStart(){camStop();const vf=$('#vf');if(!vf)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){vf.innerHTML='<p>이 화면에서는 실제 카메라를 쓸 수 없어요.<br>셔터를 누르면 휴대폰 카메라나 사진 선택 창이 열리고, 고른 사진이 사진첩에 저장됩니다.</p>';return}
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});if(!$('#vf')){camStop();return}$('#vf').innerHTML='<video id="camv" autoplay playsinline muted></video>';$('#camv').srcObject=camStream}
 catch(e){const v=$('#vf');if(v)v.innerHTML='<p>카메라 권한이 없거나 이 화면에서 카메라를 쓸 수 없어요.<br>셔터를 누르면 사진을 골라 \'촬영\'할 수 있어요.</p>'}}
function camStop(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
X.shoot=async()=>{const vid=$('#camv');const fl=document.createElement('div');fl.className='flash';
 if(vid&&camStream&&vid.videoWidth){$('#vf').appendChild(fl);const c=document.createElement('canvas');c.width=vid.videoWidth;c.height=vid.videoHeight;const x=c.getContext('2d');if(camFacing==='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(vid,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));const ref=await saveMedia(new File([blob],'photo.jpg',{type:'image/jpeg'}));P.photos.push({id:uid(),src:ref,date:nowS(),desc:'',fav:false,albums:[]});save();camLast()}
 else{const r=await uploadMedia('image/*',false,true);if(r.length){$('#vf')?.appendChild(fl);P.photos.push({id:uid(),src:r[0],date:nowS(),desc:'',fav:false,albums:[]});save();camLast();toast('사진첩에 저장했어요')}}};
function camLast(){const l=P.photos[P.photos.length-1];const el=$('#camlast');if(el)el.innerHTML=l?mediaTag(l.src):''}
X.camFlip=()=>{camFacing=camFacing==='user'?'environment':'user';camStart()};
X.camLastOpen=()=>{if(!P.photos.length)return;camStop();openApp('photos')};
APPS.camera={cls:'cam',darkTop:true,close:camStop,views:{main(){return `<div class="vf" id="vf"><p>카메라를 준비하는 중…</p></div><div class="modes"><span>시네마틱</span><span>비디오</span><span class="on">사진</span><span>인물 사진</span><span>파노라마</span></div><div class="ctl"><button class="last" id="camlast" onclick="X.camLastOpen()"></button><button class="shutter" onclick="X.shoot()"><i></i></button><button class="flip" onclick="X.camFlip()">${G.flip.replace('<svg','<svg style="width:24px;height:24px"')}</button></div>`}},after(){camLast();camStart()}};

function stSampleColor(){const im=$('#nfpimg');if(!im)return;const A=APPS.stream;const S=stS();const pr=S.promos[(A.pi||0)%S.promos.length];if(pr&&pr.color)return;
 const go=()=>{try{const c=document.createElement('canvas');const w=40,h=60;c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,Math.floor(h*.72),w,Math.floor(h*.28)).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}r/=n;g/=n;b/=n;const k=.82;const col=`rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;A.pcol=col;const el=$('.nfprof2');if(el)el.style.setProperty('--pc',col)}catch(e){}};
 if(im.complete&&im.naturalWidth)go();else im.onload=go}

  ${hero?`<div class="nfhero"><div class="bg">${stImg(hero)}</div><div class="ov">${hero.logo?`<img class="lgimg" src="${esc(murl(hero.logo))}" alt="">`:`<div class="ht">${esc(hero.title)}</div>`}<div class="gn"><b>${esc(hero.kind||'시리즈')}</b>${hero.genres?' • '+esc(hero.genres):''}</div><button class="pw" onclick="push('play',{id:'${hero.id}'})">▶ ${esc(hero.kind||'시리즈')} 재생</button><button class="pg2" onclick="X.stMy('${hero.id}')">${hero.mylist?'✓':'+'} 내가 찜한 리스트</button></div></div>`:`<div class="empty" style="color:#aaa">작품이 없어요.${VIEWER?'':'<br>나의 '+esc(P.apps.stream.name)+' 탭 아래 \'작품 추가\'로 채울 수 있어요.'}</div>`}

 clips(){const it=P.stream.items.filter(x=>x.video||x.poster);return `<div class="nfclips">${it.map(x=>`<div class="nfclip">${x.video?`<video src="${esc(murl(x.video))}" playsinline muted loop preload="metadata"></video>`:stImg(x)}<div class="cb"><b>${esc(x.title)}</b><span>${esc(x.genres||x.kind||'')}</span><div class="bt"><button onclick="push('play',{id:'${x.id}'})">▶ 재생</button><button onclick="X.stMy('${x.id}')">${x.mylist?'✓':'+'} 내가 찜한 리스트</button></div></div></div>`).join('')||'<div class="nfclip"><div style="color:#aaa;font-size:14px">클립 영상이 없어요.</div></div>'}</div><div class="nfhead" style="position:absolute;top:50px;left:0;right:0;z-index:3"><b>클립 영상</b>${stIcons()}</div>${stTabs()}`},

  return topPad+`<div class="nfhead"><button class="lg" onclick="replaceView('profiles')" style="display:flex;align-items:center;gap:8px">${stAv(pf,30)}<span>${esc(pf.name)} ▾</span></button>${stIcons()}</div><div class="scroll"><div class="nfsave">${NFI.dl}<div><b>저장한 콘텐츠 목록</b><span>저장하신 시리즈와 영화가 여기에 표시됩니다.</span></div><span style="font-size:20px">›</span></div>${stRow('시청 중인 콘텐츠',cw,stCont)}${stRow('마음에 들어 하신 시리즈와 영화',lk,x=>`<div class="nfcw">${stPoster(x)}<div class="ft" style="justify-content:center;gap:6px;font-size:13px">${G.send.replace('<svg','<svg style="width:16px"')} 공유</div></div>`)}${stRow('내가 찜한 리스트',ml,stPoster,'<span class="mr">모두 보기 ›</span>')}${VIEWER?'':`<div style="padding:20px 14px;display:flex;flex-direction:column;gap:10px"><button class="nfbtn" onclick="X.stAdd()">+ 작품 추가</button><button class="nfbtn g" onclick="push('manage')">프로필 · 첫 화면 관리</button></div>`}<div style="height:110px"></div></div>${stTabs()}`},

function lnBubbles(c){let out='',day='',kept=!c.keep||c.msgs.some(m=>m.type==='system');c.msgs.forEach((m,i)=>{const dl=lnDayLabel(m.date);if(dl!==day){out+=`<div class="lnday"><span>${esc(dl)}</span></div>`;day=dl;if(!kept){out+=`<div class="lnsys"><span>${LNKEEP}</span></div>`;kept=true}}
  if(m.type==='system'){out+=`<div class="lnsys" onclick="X.lnMsg('${c.id}','${m.id}')"><span>${esc(m.text)}</span></div>`;return}
  const me=m.from==='me';const pv=c.msgs[i-1];const first=!pv||pv.from!==m.from||pv.type==='system'||lnDayLabel(pv.date)!==dl||(pv.who||'')!==(m.who||'');
  let b;if((m.type==='image'||m.type==='video')&&m.media)b=`<div class="lnb med">${mediaTag(m.media,m.type==='video'?'controls playsinline':'')}</div>`;else if(m.type==='sticker'&&m.media)b=`<div class="lnb stk">${mediaTag(m.media)}</div>`;else b=`<div class="lnb">${esc(m.text||'')}</div>`;
  const meta=`<div class="lnmeta">${me&&m.read?'<span>읽음</span>':''}<span>${esc(lnTime(m.date))}</span></div>`;
  out+=`<div class="lnm ${me?'me':''} ${first?'first':''}" onclick="X.lnMsg('${c.id}','${m.id}')">${me?'':(first?lnAv(lnPhoto(c),36,false):'<span style="width:36px;flex-shrink:0"></span>')}<div class="col">${!me&&first?`<div class="who">${esc(m.who||lnName(c))}</div>`:''}<div class="ln">${b}${meta}</div></div></div>`});return out}

function gpD(){const g=P.gpt=P.gpt||{};if(!g.chats)g.chats=[];if(!g.promo)g.promo={show:true,img:'',title:'인텔리전트 UI를 탑재한 GPT-6',sub:'눈으로 보고 활용하는 인터랙티브 답변과 함께\n아이디어를 실현해 보세요',btn:'GPT-6 사용해 보기'};if(g.upgrade===undefined)g.upgrade='업그레이드';return g}
function gpMD(t){const lines=String(t||'').split('\n');let h='',list=null;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1 ↗</a>');
 const close=()=>{if(list){h+=`</${list}>`;list=null}};
 lines.forEach(l=>{let m;if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inl(m[1])}</li>`}else if(m=l.match(/^\s*(\d+)[.)]\s+(.*)/)){if(list!=='ol'){close();h+=`<ol start="${m[1]}">`;list='ol'}h+=`<li>${inl(m[2])}</li>`}else if(m=l.match(/^(#{1,3})\s+(.*)/)){close();h+=`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`}else if(/^\s*---+\s*$/.test(l)){close();h+='<hr>'}else if(!l.trim()){close()}else{close();h+=`<p>${inl(l)}</p>`}});close();return h}

X.gpAttach=async()=>{if(VIEWER)return;const g=gpD();const A=APPS.gpt;let c=byId(g.chats,A.cur);if(!c)return;const r=await pickFromPhotos(true).catch(()=>[]);if(!r||!r.length)return;c.msgs.push({id:uid(),role:ED()&&A.who==='ai'?'ai':'user',text:'',images:r,date:nowS()});save();render()};
function gpDate(s){const d=pd(s);if(!d)return'';const n=nowD();const y=new Date(n);y.setDate(n.getDate()-1);const day=sameDay(d,n)?'오늘':sameDay(d,y)?'어제':`${d.getMonth()+1}월 ${d.getDate()}일`;return `${day} ${kTime(hm(s),1)}`}
function gpSideHTML(){const g=gpD();const cur=APPS.gpt.cur;return `<div class="gpside"><div class="gph"><b>ChatGPT</b><span>${GPI.search}</span></div><div class="gpnav">${[[GPI.img,'이미지'],[GPI.lib,'라이브러리'],[GPI.proj,'프로젝트'],[GPI.clock,'예약'],[GPI.exp,'탐색하기']].map(([i,l])=>`<div>${i}<span>${l}</span></div>`).join('')}</div><div class="gplist">${g.chats.map(c=>`<button class="${c.id===cur?'on':''}" onclick="X.gpOpen('${c.id}')">${esc(c.title||'새 채팅')}</button>`).join('')}${g.chats.length?'<span class="more">모두 보기...</span>':''}</div><div class="gpsb"><button class="new" onclick="X.gpNew()">${GPI.chat}<span>Chat</span></button><span class="gr">${GPI.gear}</span></div></div>`}
APPS.gpt={cls:'gpapp',cur:null,who:'user',views:{
 main:()=>APPS.gpt.views.home(),
 home(){const g=gpD();const A=APPS.gpt;const c=byId(g.chats,A.cur);const ed=!VIEWER&&ED();let body;
  if(!c){body=`<div class="gpsug">${[[GPI.img2,'이미지나 스티커 만들어줘'],[GPI.pen,'글쓰기'],[GPI.globe,'웹 검색']].map(([i,l])=>`<div>${i}<span>${l}</span></div>`).join('')}</div>`}
  else{let last='';body=`<div class="gpmsgs">${c.msgs.map((m,i)=>{const d=(m.date||'').slice(0,13);let sep='';if(m.role==='user'&&d&&d!==last){sep=`<div class="gpdt">${esc(gpDate(m.date))}</div>`;last=d}
   const ims=(m.images||[]).length?`<div class="gpims ${m.role}">${m.images.map(u=>`<span onclick="event.stopPropagation();openViewer(['${esc(u)}'],0)">${mediaTag(u)}</span>`).join('')}</div>`:'';
   const isLast=i===c.msgs.length-1;
   if(m.role==='user')return sep+`<div class="gpu" onclick="X.gpMsg('${c.id}','${m.id}')">${ims}${m.text?`<div class="bb">${esc(m.text)}</div>`:''}</div>`;
   return sep+`<div class="gpa ${isLast&&A.stream===c.id?'stream':''}" onclick="X.gpMsg('${c.id}','${m.id}')">${ims}<div class="md">${gpMD(m.text)||(VIEWER?'':'<p class="ph">(답변을 눌러 내용을 적어 주세요)</p>')}</div><div class="ac">${GPI.copy}${GPI.share}${GPI.smile}${GPI.down}${GPI.dots}</div></div>`}).join('')}<div style="height:20px"></div></div>`}
  A.stream=null;
  return topPad+`<div class="gphd">${c?`<button class="ci" onclick="X.gpSide(true)">${GPI.menu}</button><span style="flex:1"></span><div class="pill"><button onclick="X.gpNew()">${GPI.newc}</button><button onclick="X.gpChatMenu()">${GPI.dots}</button></div>`:`<button class="ci" onclick="X.gpSide(true)">${GPI.menu}</button>${g.upgrade?`<button class="up" onclick="X.gpCfg()">${GPI.spark}<span>${esc(g.upgrade)}</span></button>`:''}<span style="flex:1"></span><button class="ci">${GPI.temp}</button>`}</div><div class="scroll" id="gpsc"${c?'':' style="display:flex;flex-direction:column"'}>${body}</div><div class="gpinw">${ed?`<button class="whobtn" onclick="X.gpWho()">${A.who==='ai'?'답변':'질문'} ⇄</button>`:''}<div class="gpin"><button onclick="X.gpAttach()">${GPI.plus}</button><textarea id="gpin" rows="1" placeholder="ChatGPT에게 물어보세요" ${VIEWER?'readonly':''} oninput="this.closest('.gpin').classList.toggle('typing',!!this.value.trim())"></textarea><span class="mc">${GPI.mic}</span><button class="vo">${GPI.wave}</button><button class="sd" onclick="X.gpSend()">${GPI.up}</button></div></div>${gpSideHTML()}<div class="gpdim" onclick="X.gpSide(false)"></div>`}
},after(v,p,keep){const sc=$('#gpsc');if(sc&&!keep)sc.scrollTop=sc.scrollHeight}};

/* ================= 유튜브 (따로 만든 영상 사이트를 띄움) ================= */
function ytCfg(){const d=P.ytapp=P.ytapp||{};if(d.url===undefined)d.url='';if(d.ep===undefined)d.ep='';return d}
X.ytCfgEdit=()=>{if(VIEWER)return;sheetForm({title:'유튜브 앱 연결',fields:[{k:'url',label:'영상 사이트 주소 (예: https://○○.vercel.app/tube.html)'},{k:'ep',label:'폰에서 보여 줄 회차 (이 회차까지의 영상이 보여요 · 비우면 사이트 기본값)',type:'number'}],data:ytCfg(),onSave:d=>{d.url=String(d.url||'').trim();if(d.url&&!/^https?:\/\//.test(d.url))d.url='https://'+d.url;Object.assign(ytCfg(),d)}})};
APPS.ytapp={cls:'xappv',views:{main(){const c=ytCfg();
 if(!c.url)return topPad+`<div class="xempty"><b style="color:#f00">▶</b>${VIEWER?'':'<p>영상 사이트 주소를 연결해 주세요.</p><button onclick="X.ytCfgEdit()">연결하기</button>'}</div>`;
 return topPad+`${!VIEWER&&ED()?`<button class="xcfg" onclick="X.ytCfgEdit()">유튜브 앱 연결 설정</button>`:''}<iframe class="xfr" src="${esc((()=>{const e=+c.ep||(phoneEP()!==Infinity?phoneEP():0);return e?c.url+(c.url.includes('?')?'&':'?')+'ep='+e:c.url})())}" title="YouTube" allow="autoplay; fullscreen" allowfullscreen></iframe>`}}};
/* ================= X (따로 만든 X 사이트를 띄움) ================= */
function xCfg(){const d=P.xapp=P.xapp||{};if(d.url===undefined)d.url='';if(d.me===undefined)d.me='';if(d.ep===undefined)d.ep='';return d}
X.xCfgEdit=()=>{if(VIEWER)return;sheetForm({title:'X 앱 연결',fields:[{k:'url',label:'X 사이트 주소 (예: https://x-site-abc.vercel.app)'},{k:'me',label:'이 인물의 X 아이디 (@ 빼고, 예: hznvew)'},{k:'ep',label:'폰에서 보여 줄 회차 (이 회차까지의 글이 보여요 · 비우면 사이트 기본값)',type:'number'}],data:xCfg(),onSave:d=>{d.url=String(d.url||'').trim().replace(/\/+$/,'');if(d.url&&!/^https?:\/\//.test(d.url))d.url='https://'+d.url;d.me=String(d.me||'').replace(/^@/,'').trim();Object.assign(xCfg(),d)}})};
APPS.xapp={cls:'xappv',views:{main(){const c=xCfg();
 if(!c.url)return topPad+`<div class="xempty"><b>X</b>${VIEWER?'':'<p>X 사이트 주소를 연결해 주세요.</p><button onclick="X.xCfgEdit()">연결하기</button>'}</div>`;
 const src=c.url+'/?embed=1'+(c.me?'&me='+encodeURIComponent(c.me):'')+((+c.ep||(phoneEP()!==Infinity?phoneEP():0))?'&ep='+(+c.ep||phoneEP()):'');
 return topPad+`${!VIEWER&&ED()?`<button class="xcfg" onclick="X.xCfgEdit()">X 앱 연결 설정</button>`:''}<iframe class="xfr" src="${esc(src)}" title="X"></iframe>`}}};

 wifis:'KT_GiGA_5G_3F21\nU+Net8A2C\niptime\nSK_WiFiGIGA1E70',bts:'AirPods Pro | 연결 안 됨\nGalaxy Buds | 연결 안 됨\n차량 블루투스 | 연결 안 됨',devs:'iPad (2) | iPad Pro\niPad (3) | iPad Air\nMacBook Air | MacBook Air 13',family:[]});

const FSI=(bg,glyph)=>`<span class="sicon" style="background:${bg}">${glyph}</span>`;

function fsRow(icon,label,value,fn,extra=''){return `<button class="row fsr" onclick="${fn||''}">${icon||''}<div class="bd" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px"><span class="fsl">${label}</span><span class="t2" style="display:flex;align-items:center;gap:6px;flex-shrink:0">${extra}${value?esc(value):''} <span class="chev">›</span></span></div></button>`}
const fsLines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const[a,b]=x.split('|').map(y=>(y||'').trim());return{a,b}});

const ADM={on:false,stack:[{t:'home'}]};
function admOpen(sec){if(VIEWER){toast(VMSG);return}ADM.on=true;ADM.stack=[{t:'home'}];if(sec)ADM.stack.push({t:sec});$('#admin').classList.add('on');$('#preview').style.display='none';admRender()}
function admClose(){ADM.on=false;$('#admin').classList.remove('on');$('#preview').style.display='none';rerenderAll()}
X.admPush=s=>{ADM.stack.push(s);admRender();$('#admin .ac')&&($('#admin .ac').scrollTop=0)};
X.admBack=()=>{if(ADM.stack.length>1)ADM.stack.pop();admRender()};
X.admPrev=()=>{$('#admin').classList.remove('on');$('#preview').style.display='block';rerenderAll()};
$('#preview').onclick=()=>{$('#admin').classList.add('on');$('#preview').style.display='none';admRender()};
const colBy=k=>COLS().find(c=>c.k===k);
function admItemRow(c,it,i,arr,parent,child){const [a,b]=(child?c.sum(it,parent):c.sum(it));const im=c.img&&c.img(it);const pid=parent?parent.id:'';
 return `<div class="ai"><button style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:left" onclick="X.admItem('${c.k}','${pid}','${it.id}',${!!child})">${im&&murl(im)?(isVid(im)?`<video src="${esc(murl(im))}" muted style="width:36px;height:36px;border-radius:8px;object-fit:cover"></video>`:`<img src="${esc(murl(im))}" alt="">`):''}<span class="x"><b>${esc(a||'(비어 있음)')}</b><small>${esc(b||'')}</small></span></button><span class="mv"><button onclick="X.admMove('${c.k}','${pid}',${i},-1)">↑</button><button onclick="X.admMove('${c.k}','${pid}',${i},1)">↓</button></span></div>`}
X.admItem=(k,pid,id,child)=>{const c=colBy(k);if(!child&&c.child)X.admPush({t:'list',k,pid:id});else X.admPush({t:'form',k,pid,id,child})};
X.admMove=(k,pid,i,d)=>{const c=colBy(k);const arr=pid?c.child.arr(byId(c.arr(),pid)):c.arr();const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();admRender()};

const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function dataToBlob(u){const r=await fetch(u);return r.blob()}
async function deliver(name,text){const blob=new Blob([text],{type:'application/json'});
 if(CLOUD.downloads){try{await CLOUD.downloads.save({filename:name,data:blob});return}catch(e){if(e&&e.code==='declined')return}}
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
X.exportData=async(which,ph)=>{const phones=which==='all'?STORE.phones:[ph||P];const s=JSON.stringify(phones);const ids=[...new Set([...s.matchAll(/media:([iv]_[a-z0-9]+)/g)].map(m=>m[1]))];toast('백업 파일 만드는 중…');
 const media={};for(const id of ids){const b=await IDB.get('media',id);if(b)media[id]=await blobToData(b)}
 const aids=[...new Set([...s.matchAll(/asset:([0-9a-f]+)/g)].map(m=>m[1]))];const assets={};let k=0;for(const id of aids){k++;toast(`사진·영상 담는 중 ${k}/${aids.length}`);try{const r=await fetch('/_blob/'+id);if(r.ok)assets[id]=await blobToData(await r.blob())}catch(e){}}
 const out=JSON.stringify({app:'virtual-phone',v:2,exported:new Date().toISOString(),phones,assetKinds:STORE.assetKinds||{},media,assets});
 const d=new Date();await deliver(`휴대폰백업_${which==='all'?'전체':phones[0].owner}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,out)};
X.importData=async()=>{const fs=await pickFiles('application/json,.json');if(!fs.length)return;let data;try{data=JSON.parse(await fs[0].text())}catch(e){alertBox('파일을 읽을 수 없어요','이 사이트에서 내보낸 .json 백업 파일인지 확인해 주세요.');return}
 if(data.app!=='virtual-phone'||!Array.isArray(data.phones)){alertBox('가져올 수 없어요','이 사이트의 백업 파일이 아니에요.');return}
 const replace=await new Promise(r=>actionSheet(`인물 ${data.phones.length}명의 데이터가 들어 있어요`,[{label:'지금 데이터는 두고 인물로 추가',fn:()=>r(false)},{label:'지금 데이터를 모두 이 파일로 바꾸기',red:true,fn:()=>r(true)}]));
 for(const [id,u] of Object.entries(data.media||{})){try{const b=await dataToBlob(u);await IDB.put('media',id,b);MURL[id]=URL.createObjectURL(b)}catch(e){}}
 STORE.assetKinds={...(STORE.assetKinds||{}),...(data.assetKinds||{})};
 const ps=data.phones.map(fixPhone);if(replace){STORE.phones=ps}else{ps.forEach(p=>{if(STORE.phones.some(x=>x.id===p.id))p.id=uid();STORE.phones.push(p)})}
 delete STORE.sample;X.switchPhone(ps[0].id);save();admRender();alertBox('가져왔어요','')};
X.persist=async()=>{try{const ok=await navigator.storage.persist();alertBox(ok?'설정했어요':'거절됨',ok?'브라우저가 이 사이트의 데이터를 함부로 지우지 않도록 설정했어요.':'브라우저가 요청을 거절했어요. 내보내기로 백업해 두세요.')}catch(e){alertBox('지원하지 않아요','이 브라우저는 지원하지 않아요.')}};
X.mediaToCloud=async(silent)=>{if(!CLOUD.assets)return;let s=JSON.stringify(STORE.phones);const ids=[...new Set([...s.matchAll(/media:([iv]_[a-z0-9]+)/g)].map(m=>m[1]))];if(!ids.length){if(!silent)alertBox('옮길 항목이 없어요','');return}if(!silent&&!(await confirmBox(`${ids.length}개 파일을 클라우드로 올릴까요?`,'')))return;let n=0;

function fixPhone(p){const b=blankPhone(p.owner);for(const k in b)if(p[k]===undefined)p[k]=b[k];for(const k of ['talk','web','insta','stream','translate','banner','clock'])for(const kk in b[k])if(p[k][kk]===undefined)p[k][kk]=b[k][kk];for(const k in b.apps)if(!p.apps[k])p.apps[k]=b.apps[k];if(!p.insta.accounts.length)p.insta.accounts=b.insta.accounts;if(!p.insta.accounts.find(a=>a.id===p.insta.me))p.insta.me=p.insta.accounts[0].id;return p}
function mig(){let ch=false;STORE.phones.forEach(p=>{if(p.mig1)return;p.lock.bg='dark';p.lock.ink='glass';p.banner.show=false;if(!p.wallpaper)p.wallColor='#6b6b6d';p.mig1=true;ch=true});if(ch)setTimeout(save,300)}
/* ---- 방문자에게 공개 (페이지에 내용 싣기) ---- */
let SEED=null,VCONF=false;
function seedInline(){try{const t=document.getElementById('seed')?.textContent;const d=t&&JSON.parse(t);return d&&d.phones?d:null}catch(e){return null}}
async function loadSeed(){let a=seedInline(),b=null;try{const r=await fetch('seed.json',{cache:'no-store'});if(r.ok){const d=await r.json();if(d&&d.phones)b=d}}catch(e){}SEED=a&&b?((b.updated||0)>=(a.updated||0)?b:a):(a||b);maybeSeed()}
function maybeSeed(){if(!SEED||!STORE)return;const viewerNow=VCONF&&VIEWER;if(!viewerNow&&!STORE.sample)return;
 if(viewerNow&&STORE.src==='seed'&&(STORE.updated||0)>=(SEED.updated||0))return;
 if(viewerNow&&STORE.src==='cloud'&&(STORE.updated||0)>=(SEED.updated||0))return;
 STORE.phones=clone(SEED.phones).map(fixPhone);STORE.current=SEED.current;STORE.assetKinds={...(STORE.assetKinds||{}),...(SEED.assetKinds||{})};STORE.updated=SEED.updated;STORE.src='seed';delete STORE.sample;
 P=STORE.phones.find(p=>p.id===STORE.current)||STORE.phones[0];if(NAV){try{render('',true)}catch(e){goHome()}}renderHome();if(LOCKED)renderLock()}
X.pubNow=async()=>{if(VIEWER)return;const art=CLOUD.artifact;if(!art){alertBox('Claude에게 부탁해 주세요','지금은 이 버튼으로 바로 공개할 수 없어요. Claude와의 대화창에서 "방문자에게 공개해 줘"라고 말하면 지금 내용이 방문자 화면에 반영돼요.');return}
 if(!(await confirmBox('방문자에게 공개할까요?','지금 이 휴대폰의 내용(모든 인물)이 링크로 들어오는 방문자에게 그대로 보이게 돼요.','공개')))return;
 toast('사진·영상을 올리는 중…');try{await X.mediaToCloud(true)}catch(e){}
 const seed={v:1,updated:Date.now(),current:STORE.current,assetKinds:STORE.assetKinds||{},phones:STORE.phones};const json=JSON.stringify(seed);
 if(/media:[iv]_/.test(json)&&!(await confirmBox('일부 사진이 아직 올라가지 않았어요','방문자에게 그 사진들은 안 보일 수 있어요. 그래도 공개할까요?','공개')))return;
 toast('공개하는 중…');STORE.pubAt=seed.updated;STORE.updated=seed.updated;try{await IDB.put('kv','store',STORE)}catch(e){}
 try{await art.publish({'seed.json':{content:json,contentType:'application/json'}});SEED=seed;admRender();alertBox('공개했어요','이제 방문자에게 지금 내용이 보여요. 내용을 바꾼 뒤에는 다시 \'방문자에게 공개하기\'를 눌러 주세요.');return}
 catch(e){const c=e&&e.code;if(c==='conflict')return;if(c==='not_writer'||c==='not_granted'){alertBox('공개할 수 없어요','이 계정은 이 페이지를 고칠 권한이 없어요.');return}}
 try{const src=await (await fetch(location.href,{cache:'no-store'})).text();if(!/<script id="seed" type="application\/json">/.test(src)||!/^\s*<!DOCTYPE html>/i.test(src))throw new Error('페이지 원본을 읽지 못했어요.');
  const html=src.replace(/<script id="seed" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="seed" type="application/json">'+json.replace(/</g,'\\u003c')+'<\/script>');await art.publish(html)}
 catch(e){alertBox('공개하지 못했어요',(e&&e.message)||'잠시 뒤 다시 시도해 주세요.')}};
async function boot(){
 try{await IDB.open()}catch(e){document.body.innerHTML='<p style="padding:30px;font:16px sans-serif">이 브라우저에서는 저장 기능을 쓸 수 없어요. 사파리의 개인정보 보호 브라우징을 끄고 다시 열어 주세요.</p>';return}
 let s=null;try{s=await IDB.get('kv','store')}catch(e){}
 if(!s||!s.phones||!s.phones.length){const p=samplePhone();s={phones:[p],current:p.id,edit:false,sample:true,assetKinds:{}}}
 STORE=s;STORE.phones.forEach(fixPhone);mig();P=STORE.phones.find(p=>p.id===STORE.current)||STORE.phones[0];STORE.current=P.id;
 try{for(const k of await IDB.keys('media')){const b=await IDB.get('media',k);if(b)MURL[k]=URL.createObjectURL(b)}}catch(e){}
 renderHome();if(P.lock&&P.lock.on)lockNow();else showBanner();
 setInterval(()=>{renderStatus();if(LOCKED)renderLock();if(!NAV&&P.clock.mode==='real'&&new Date().getSeconds()<20)renderHome()},20000);
 window.addEventListener('resize',()=>{if(ADM.on)admRender()});
 initSB();
}
window.addEventListener('error',e=>{console.error(e.error||e.message);toast('오류: '+(e.message||'알 수 없는 오류'))});
document.body.classList.add('viewer');
['setDark','setEdit','setClock','setBasic','setWall','appEdit','lockSet','phAdd','phSel','phSelAct','albAdd','albMenu','newNote','noteInput','noteChk','noteAddChk','noteImg','noteMenu','evAdd','evEdit','evDel','calEdit','calAdd','alAdd','alEdit','cityAdd','cityEdit','addCall','editCall','vmAdd','vmEdit','dialAdd','dialEdit','phFavAdd','addContact','editContact','myCard','toggleFav','smsSend','smsAttach','smsThreadEdit','smsNew','smsMsg','tkSend','tkAttach','tkNew','tkRoomEdit','tkAd','tkMe','tkMsg','tkShopAdd','tkShopEdit','spLike','shopCfg','tkNewOpen','tkMute','igNewPost','igEditPost','igEditAcc','igAddAcc','igAddStory','igComment','igMenu','igSwitch','igShare','igCreate','igMk','igPick','igDraft','igPublish','igDmSend','igDmAttach','igDmEdit','igDmNew','igHlAdd','igHlEdit','igNoteEdit','igRecentDel','igDmMove','trEdit','stAdd','stEdit','stPromoAdd','stPromoEdit','bmEdit','bmAdd','siteNew','siteEdit','resNew','resEdit','resTap','brHistDel','brHistClear','brShare','shoot','fMedia','exportData','importData','resetAll','phNew','phMore'].forEach(k=>{const f=X[k];if(!f)return;const keep=['smsMsg','tkMsg','resTap'].includes(k);X[k]=(...a)=>{if(VIEWER&&!keep){toast(VMSG);return}return f(...a)}});
/* ================= Supabase 연결 (Vercel 배포용) ================= */
async function sbUpload(blob,vid,ext0){const t=blob.type||'';const ext=ext0?ext0:vid?(t.includes('quicktime')?'mov':t.includes('webm')?'webm':'mp4'):(t==='image/png'?'png':t==='image/gif'?'gif':t==='image/webp'?'webp':'jpg');const path=`${Date.now().toString(36)}-${uid()}.${ext}`;
 const {error}=await SB.storage.from('phone-media').upload(path,blob,{contentType:t||undefined,upsert:false});if(error)throw error;return SB.storage.from('phone-media').getPublicUrl(path).data.publicUrl}
let sbSaving=false,sbAgain=false;const SBLAST={};
async function sbPush(){if(!SB||VIEWER)return;if(sbSaving){sbAgain=true;return}sbSaving=true;sbAgain=false;
 try{for(const ph of STORE.phones){const s=JSON.stringify(ph);if(SBLAST[ph.id]===s)continue;const {error}=await SB.from('phones').upsert({id:ph.id,slug:ph.slug||ph.id,owner_name:ph.owner||'',data:ph,updated_at:new Date().toISOString()});if(error)throw error;SBLAST[ph.id]=s}}
 catch(e){console.warn(e);toast('온라인 저장 실패: '+(e.message||'')+' · 이 기기에는 저장됨')}
 sbSaving=false;if(sbAgain)setTimeout(sbPush,50)}
function sbLogin(){const l=layer(`<div class="dim"></div><div class="dlg"><div class="m"><b>관리자 로그인</b>Supabase 관리자 계정으로 로그인하세요.<input id="sbe" type="email" placeholder="이메일" autocomplete="username"><input id="sbp" type="password" placeholder="비밀번호" autocomplete="current-password"></div><div class="bs"><button data-v="0">취소</button><button data-v="1">로그인</button></div></div>`);
 l.querySelectorAll('.bs button').forEach(b=>b.onclick=async()=>{if(b.dataset.v==='0'){l.remove();return}const {error}=await SB.auth.signInWithPassword({email:$('#sbe').value.trim(),password:$('#sbp').value});if(error){toast('로그인 실패: '+error.message);return}location.href=location.pathname+(SLUG?'?p='+encodeURIComponent(SLUG):'')})}
X.sbOut=async()=>{await SB.auth.signOut();location.href=location.pathname};
async function initSB(){
 if(!SB){VCONF=true;setViewer(true);alertBox('설정이 필요해요','index.html 맨 위의 SUPABASE_URL과 SUPABASE_KEY를 채워 주세요.');return}
 let own=false;try{const {data:{session}}=await SB.auth.getSession();if(session){const {data}=await SB.from('phone_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();own=!!data;if(!own)toast('이 계정은 관리자로 등록되어 있지 않아요')}}catch(e){console.warn(e)}
 setViewer(!own);VCONF=true;
 const {data,error}=await SB.from('phones').select('id,slug,data,updated_at');
 if(error){alertBox('불러오기 실패',error.message);return}
 if(own){
  if(data.length){const ru=Math.max(...data.map(r=>Date.parse(r.updated_at)||0));
   if(STORE.sample||!STORE.updated||ru>STORE.updated){STORE.phones=data.map(r=>fixPhone({...r.data,id:r.id,slug:r.slug}));const keep=STORE.phones.find(p=>p.id===STORE.current);P=keep||STORE.phones[0];STORE.current=P.id;STORE.updated=ru;delete STORE.sample;data.forEach(r=>{const ph=STORE.phones.find(p=>p.id===r.id);SBLAST[r.id]=JSON.stringify(ph)});await IDB.put('kv','store',STORE);if(NAV)goHome();rerenderAll()}
   else sbPush()}
  else sbPush();
 }else{
  let row=SLUG?data.find(r=>r.slug===SLUG):null;if(!row&&SLUG){const m=SLUG.match(/^(.+?)-?(\d+)$/);if(m){row=data.find(r=>r.slug===m[1]);if(row)LINK_EP=+m[2]}}if(!row)row=data.find(r=>r.data&&r.data.isDefault)||data[0];
  if(row){const ph=fixPhone({...row.data,id:row.id,slug:row.slug});STORE.phones=[ph];STORE.current=ph.id;delete STORE.sample;P=ph;if(NAV)goHome();rerenderAll();if(P.lock&&P.lock.on&&!LOCKED)lockNow()}
  if(QS.has('admin'))sbLogin();
 }}
X.pubNow=()=>alertBox('자동으로 공개돼요','이 사이트에서는 저장하는 순간 방문자 화면에도 바로 반영돼요. 따로 공개할 필요가 없어요.');
X.phMore=id=>{const p=STORE.phones.find(x=>x.id===id);const link=location.origin+location.pathname+'?p='+encodeURIComponent(p.slug||p.id);
 actionSheet(p.owner,[
  {label:`링크 복사 (?p=${p.slug||p.id})`,fn:async()=>{try{await navigator.clipboard.writeText(link);toast('링크를 복사했어요')}catch(e){promptBox('이 인물의 링크','아래 주소를 길게 눌러 복사하세요',link)}}},
  {label:'회차별 링크 복사 (예: ?p='+(p.slug||p.id)+'-2)',fn:async()=>{const n=await promptBox('몇 화까지 보이는 링크인가요?','숫자만 적어 주세요 (예: 2)','');if(n===null)return;const e=parseInt(n,10);if(!e){toast('숫자를 적어 주세요');return}const l=location.origin+location.pathname+'?p='+encodeURIComponent((p.slug||p.id)+'-'+e);try{await navigator.clipboard.writeText(l);toast(e+'화 링크를 복사했어요')}catch(_){promptBox(e+'화 링크','아래 주소를 길게 눌러 복사하세요',l)}}},
  {label:'링크 이름 바꾸기',fn:async()=>{const n=await promptBox('링크 이름','영어 소문자·숫자·- 만 쓸 수 있어요 (예: jiho)',p.slug||'');if(n===null)return;const v=n.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(!v){toast('영어 소문자나 숫자로 적어 주세요');return}if(STORE.phones.some(x=>x!==p&&x.slug===v)){toast('이미 쓰는 이름이에요');return}p.slug=v;save();admRender()}},
  {label:`보여 줄 회차 (${p.ep?p.ep+'화까지':'전부'})`,fn:()=>{sheetForm({title:p.owner+' 폰의 회차',fields:[{k:'ep',label:'회차 (이 회차까지의 내용이 보여요 · 비우면 전부)',type:'number'}],data:{ep:p.ep||''},onSave:d=>{p.ep=d.ep}})}},
  {label:'기본 인물로 지정 (링크에 이름이 없을 때 보일 폰)',fn:()=>{STORE.phones.forEach(x=>x.isDefault=x===p);save();toast('기본 인물로 정했어요')}},
  {label:'이름 바꾸기',fn:async()=>{const n=await promptBox('이름 바꾸기','',p.owner);if(n){p.owner=n;save();refreshPhone();admRender()}}},
  {label:'복제하기',fn:()=>{const cp=clone(p);cp.id=uid();cp.slug='';cp.isDefault=false;cp.owner=p.owner+' (복사본)';STORE.phones.push(cp);save();admRender();toast('복제했어요')}},
  {label:'이 인물만 내보내기',fn:()=>X.exportData('one',p)},
  {label:'삭제하기',red:true,fn:async()=>{if(STORE.phones.length<2){alertBox('삭제할 수 없어요','마지막 한 명은 삭제할 수 없어요.');return}if(await confirmBox(`${p.owner}의 휴대폰을 삭제할까요?`,'연락처·대화·사진 기록이 모두 지워집니다.','삭제',true)){STORE.phones=STORE.phones.filter(x=>x.id!==id);if(P.id===id)X.switchPhone(STORE.phones[0].id);save();try{await SB.from('phones').delete().eq('id',id)}catch(e){}admRender()}}}])};
X.importData=async()=>{const fs=await pickFiles('application/json,.json');if(!fs.length)return;let data;try{data=JSON.parse(await fs[0].text())}catch(e){alertBox('파일을 읽을 수 없어요','이 사이트에서 내보낸 .json 백업 파일인지 확인해 주세요.');return}
 if(data.app!=='virtual-phone'||!Array.isArray(data.phones)){alertBox('가져올 수 없어요','이 사이트의 백업 파일이 아니에요.');return}
 const replace=await new Promise(r=>actionSheet(`인물 ${data.phones.length}명의 데이터가 들어 있어요`,[{label:'지금 데이터는 두고 인물로 추가',fn:()=>r(false)},{label:'지금 데이터를 모두 이 파일로 바꾸기',red:true,fn:()=>r(true)}]));
 let s=JSON.stringify(data.phones);const jobs=[];Object.entries(data.media||{}).forEach(([id,u])=>jobs.push(['media:'+id,u,id.startsWith('v_')]));Object.entries(data.assets||{}).forEach(([id,u])=>jobs.push(['asset:'+id,u,(data.assetKinds||{})[id]==='v']));
 let n=0,fail=0;for(const [key,u,vid] of jobs){n++;toast(`사진·영상 올리는 중 ${n}/${jobs.length}`);try{const b=await (await fetch(u)).blob();const url=await sbUpload(b,vid||String(b.type).startsWith('video/'));s=s.split(key).join(url)}catch(e){fail++}}
 const ps=JSON.parse(s).map(fixPhone);if(replace)STORE.phones=ps;else ps.forEach(p=>{if(STORE.phones.some(x=>x.id===p.id))p.id=uid();STORE.phones.push(p)});
 delete STORE.sample;X.switchPhone(ps[0].id);save();admRender();alertBox('가져왔어요',fail?`사진·영상 ${fail}개는 올리지 못했어요. 파일 크기(50MB)를 확인해 주세요.`:'사진과 영상도 모두 올렸어요.')};

boot();
