<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>휴대폰</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--stage:#d9dce1;--stage-ink:#1c1c1e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#1b1c1f;--stage-ink:#f2f2f7;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#1b1c1f;--stage-ink:#f2f2f7;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--stage);color:var(--stage-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
img,video{max-width:100%}
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:24px}
/* ---------- phone shell ---------- */
#phone{--bg:#fff;--bg2:#f2f2f7;--card:#fff;--ink:#000;--ink2:#8a8a8e;--line:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--green:#34c759;--fill:rgba(118,118,128,.12);
 position:relative;width:390px;height:844px;max-height:calc(100% - 24px);border-radius:52px;overflow:hidden;background:#000;color:var(--ink);box-shadow:0 0 0 10px #111,0 0 0 11px #3a3a3c,0 30px 80px rgba(0,0,0,.35);isolation:isolate;flex-shrink:0;font-size:17px;letter-spacing:-.2px}
#phone.dark{--bg:#000;--bg2:#000;--card:#1c1c1e;--ink:#fff;--ink2:#8d8d93;--line:rgba(84,84,88,.6);--blue:#0a84ff;--red:#ff453a;--green:#30d158;--fill:rgba(118,118,128,.24)}
@media (max-width:520px){#stage{display:block}#phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}}
#wall{position:absolute;inset:0;background:#1d1f24 center/cover no-repeat}
#wall::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
#status{position:absolute;top:0;left:0;right:0;height:50px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px;pointer-events:none;color:#fff;transition:color .2s}
#status.ink{color:var(--ink)}
#status .r{display:flex;gap:6px;align-items:center}
#status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.9;position:relative;padding:1px}
#status .bat i{display:block;height:100%;background:currentColor;border-radius:1.5px}
#status .bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0;opacity:.6}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:64}
@media (max-width:520px){#island{display:none}#status{padding-top:4px}}
/* home */
#home{position:absolute;inset:0;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s}
#home.away{transform:scale(.92);opacity:0;filter:blur(6px)}
#pages{position:absolute;top:58px;left:0;right:0;bottom:140px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.hpage{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:98px;padding:6px 18px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.4);position:relative}
.app .lbl{max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:500;letter-spacing:-.1px;text-shadow:0 .5px 2px rgba(0,0,0,.35);-webkit-font-smoothing:subpixel-antialiased}
.ic{width:62px;height:62px;border-radius:15px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2);flex-shrink:0}
.ic img{width:100%;height:100%;object-fit:cover}
.ic svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:-6px;right:-6px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;text-shadow:none;z-index:2}
.app:active .ic{filter:brightness(.7)}
.app .badge{right:auto;left:calc(50% + 13px);top:-8px;min-width:25px;height:25px;border-radius:13px;font-size:14px;padding:0 7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#dots{position:absolute;bottom:150px;left:0;right:0;display:flex;justify-content:center;gap:8px}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
#dots i.on{background:#fff}
#spot{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);background:rgba(120,120,128,.36);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:13px;padding:6px 12px;border-radius:14px;display:flex;gap:4px;align-items:center}
#dock{position:absolute;left:10px;right:10px;bottom:12px;height:92px;border-radius:34px;background:rgba(160,160,170,.32);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px}
#dock .lbl{display:none}
#editfab{position:absolute;left:16px;top:58px;z-index:40;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:12.5px;padding:6px 11px;border-radius:14px;display:flex;align-items:center;gap:5px}
/* banner */
#banner{position:absolute;left:8px;right:8px;top:8px;z-index:70;border-radius:22px;background:rgba(245,245,245,.82);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);color:#000;padding:11px 14px;display:flex;gap:10px;align-items:center;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.25,1.1);box-shadow:0 8px 30px rgba(0,0,0,.15)}
#banner.show{transform:none}
#phone.dark #banner{background:rgba(40,40,42,.85);color:#fff}
#banner .bi{width:38px;height:38px;border-radius:9px;overflow:hidden;position:relative;flex-shrink:0}
#banner .bi>img{width:100%;height:100%;object-fit:cover}
#banner .sm{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:5px;overflow:hidden}
#banner b{font-size:15px;display:block}#banner p{margin:1px 0 0;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#banner .t{position:absolute;right:14px;top:11px;font-size:12px;opacity:.5}
/* app layer */
#appl{position:absolute;inset:0;z-index:10;background:var(--bg);transform:scale(.3);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.85,.2,1),opacity .25s;border-radius:40px;overflow:hidden}
#appl.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
#homebar{position:absolute;bottom:0;left:0;right:0;height:26px;z-index:65;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;touch-action:none}
#homebar i{width:136px;height:5px;border-radius:3px;background:#fff;opacity:.9}
#homebar.ink i{background:var(--ink)}
.view{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.view.push{animation:pushIn .32s cubic-bezier(.2,.85,.2,1)}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
.view.pop{animation:popIn .28s ease}
@keyframes popIn{from{transform:translateX(-25%);opacity:.6}to{transform:none;opacity:1}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.top-pad{height:50px;flex-shrink:0}
.nav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex-shrink:0;position:relative;z-index:3}
.nav .ttl{position:absolute;left:70px;right:70px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nb{color:var(--blue);display:flex;align-items:center;gap:2px;min-height:40px;padding:0 6px;font-size:17px;white-space:nowrap}
.nb svg{width:22px;height:22px}
.navr{display:flex;align-items:center;gap:2px;margin-left:auto}
.pill{background:var(--fill);border-radius:20px;padding:7px 12px;font-size:15px;color:var(--ink)}
.circ{width:38px;height:38px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.circ svg{width:20px;height:20px}
.large{font-size:33px;font-weight:700;letter-spacing:.2px;padding:2px 18px 8px}
.sub{color:var(--ink2);font-size:15px;padding:0 18px 10px;margin-top:-6px}
.sbar{margin:4px 16px 10px;background:var(--fill);border-radius:11px;height:37px;display:flex;align-items:center;gap:6px;padding:0 9px;color:var(--ink2)}
.sbar input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0;color:var(--ink)}
.sbar svg{width:17px;height:17px;flex-shrink:0}
.list{background:var(--card)}
.grp{margin:0 16px 22px;border-radius:12px;background:var(--card);overflow:hidden}
.grph{font-size:13px;color:var(--ink2);padding:0 32px 6px;text-transform:none}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;position:relative;width:100%;text-align:left}
.row .bd{flex:1;min-width:0;padding:10px 0;border-bottom:.5px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.row:last-child .bd{border-bottom:0}
.row:active{background:var(--fill)}
.t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:14.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink2);opacity:.6;font-size:18px}
.av{border-radius:50%;object-fit:cover;background:linear-gradient(#a5aab3,#868b94);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-weight:600}
.av img{width:100%;height:100%;object-fit:cover}
.empty{padding:60px 30px;text-align:center;color:var(--ink2);font-size:15px;line-height:1.5}
.tabbar{flex-shrink:0;display:flex;justify-content:space-around;padding:6px 6px 30px;border-top:.5px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink2);min-width:56px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--blue)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;font-size:13.5px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.editdot{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:#ff9500;color:#fff;display:flex;align-items:center;justify-content:center;z-index:5;font-size:13px}
.ebtn{color:#ff9500!important}
.fabadd{position:absolute;right:18px;bottom:96px;width:52px;height:52px;border-radius:50%;background:#ff9500;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;z-index:8;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* sheets & dialogs (inside phone) */
#overlay{position:absolute;inset:0;z-index:80;pointer-events:none}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;top:46px;background:var(--bg2);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.85,.2,1);pointer-events:auto;color:var(--ink)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .nav{border-bottom:.5px solid var(--line)}
.fld{display:block;padding:9px 16px;border-bottom:.5px solid var(--line);background:var(--card)}
.fld:last-child{border-bottom:0}
.fld>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.fld input[type=text],.fld input[type=number],.fld input[type=datetime-local],.fld input[type=date],.fld input[type=time],.fld textarea,.fld select{width:100%;border:0;background:none;outline:none;font-size:16px;padding:2px 0;color:var(--ink)}
.fld textarea{min-height:80px;resize:vertical;line-height:1.4}
.fld .hint{font-size:12px;color:var(--ink2);margin-top:3px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mthumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--fill)}
.sbtn{background:var(--fill);border-radius:8px;padding:7px 11px;font-size:14px;color:var(--blue)}
.sbtn.red{color:var(--red)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:270px;background:rgba(242,242,242,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;text-align:center;pointer-events:auto;animation:pop .2s;color:#000;overflow:hidden}
#phone.dark .dlg{background:rgba(44,44,46,.96);color:#fff}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.dlg .m{padding:18px 16px 16px;font-size:14px;line-height:1.35}
.dlg .m b{display:block;font-size:17px;margin-bottom:4px}
.dlg input{width:100%;margin-top:10px;border:.5px solid var(--line);border-radius:7px;padding:6px 8px;font-size:14px;background:var(--card)}
.dlg .bs{display:flex;border-top:.5px solid var(--line)}
.dlg .bs button{flex:1;padding:11px;color:var(--blue);font-size:17px}
.dlg .bs button+button{border-left:.5px solid var(--line);font-weight:600}
.dlg .bs button.red{color:var(--red)}
.asheet{position:absolute;left:8px;right:8px;bottom:30px;pointer-events:auto;animation:up .28s cubic-bezier(.2,.85,.2,1)}
.asheet .g{background:rgba(245,245,245,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-top:8px}
#phone.dark .asheet .g{background:rgba(44,44,46,.96)}
.asheet button{display:block;width:100%;padding:17px;font-size:19px;color:var(--blue);border-top:.5px solid var(--line)}
.asheet .g button:first-child{border-top:0}
.asheet button.red{color:var(--red)}
.asheet .cc{font-weight:600}
.asheet .h{padding:13px;font-size:13px;color:var(--ink2);text-align:center}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;font-size:14px;padding:9px 16px;border-radius:18px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
/* ---------- lock screen ---------- */
#lock{position:absolute;inset:0;z-index:62;color:#fff;display:none;flex-direction:column;align-items:center;background:#888 center/cover no-repeat;transition:transform .42s cubic-bezier(.3,.8,.3,1),opacity .42s;touch-action:none;user-select:none;-webkit-user-select:none}
#lock.on{display:flex}
#lock.up{transform:translateY(-100%);opacity:.5}
#lock .lst{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 32px;font-weight:600;font-size:16px}
#lock .lst span{display:flex;align-items:center;gap:6px}
#lock .limg{width:63%;display:block;margin-top:2px;pointer-events:none}
#lock .ldate{margin-top:52px;font-size:22px;font-weight:600;opacity:.92}
#lock .ltime{font-size:100px;font-weight:600;line-height:1;letter-spacing:-2px;margin-top:2px;font-variant-numeric:tabular-nums}
#lock.dark{color:#1c1c1e}
#lock.glass .ldate{color:rgba(255,255,255,.72);opacity:1}
#lock.glass .ltime{color:rgba(255,255,255,.4);text-shadow:0 1.5px 0 rgba(255,255,255,.28),0 -1px 1px rgba(0,0,0,.5)}
#lock.glass .lb{background:rgba(30,30,30,.65);color:#f2f2f2;border:1px solid rgba(255,255,255,.14)}
#lock.glass .lb.on{background:#fff;color:#000}
#lock .lsvg{display:block;margin-top:-2px;overflow:visible;pointer-events:none}
#status,#lock .lst{display:none!important}
body.viewer #editfab,body.viewer .igin,body.viewer .inbar,body.viewer .tkin,body.viewer .ebar,body.viewer .fabadd,body.viewer #viewer .vbot,body.viewer .ebtn,body.viewer .whobtn{display:none!important}
body.viewer .chk i,body.viewer .chk input,body.viewer .chk button{pointer-events:none}
#lock .ltime.gl{font-size:106px;font-weight:600;letter-spacing:-1.5px;margin-top:2px;color:transparent;text-shadow:none;background:linear-gradient(180deg,rgba(255,255,255,calc(var(--ca) + .14)) 0%,rgba(255,255,255,var(--ca)) 45%,rgba(255,255,255,calc(var(--ca) - .06)) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.5px rgba(255,255,255,calc(var(--ca) * .6));filter:drop-shadow(0 1px 0 rgba(255,255,255,.22)) drop-shadow(0 -.5px .6px rgba(0,0,0,.6)) drop-shadow(0 1.5px 1px rgba(0,0,0,.18))}
#lock.mix .lst{color:#1c1c1e}#lock.mix .ldate{color:rgba(60,60,67,.62);opacity:1}
#lock .lnote{margin-top:auto;margin-bottom:126px;width:calc(100% - 20px);display:flex;gap:10px;align-items:center;text-align:left;padding:11px 14px;border-radius:22px;background:rgba(245,245,245,.6);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);color:#000;position:relative}
#lock .lnote b{display:block;font-size:15px}#lock .lnote p{margin:1px 0 0;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#lock .lnote .t{position:absolute;right:14px;top:11px;font-size:12px;opacity:.5}
#lock .lbtns{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:space-between;padding:0 42px}
#lock .lb{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;color:#000;box-shadow:0 2px 14px rgba(0,0,0,.12);transition:background .2s}
#lock .lb.on{background:#fff}
#lock .lb svg{width:24px;height:24px}
#lock .r{display:flex;gap:6px;align-items:center}
#lock .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;padding:1px;display:block}
#lock .bat i{display:block;height:100%;background:currentColor;border-radius:1.5px}
#lock .bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0;opacity:.6}
/* calendar (iOS style) */
.clhead{display:flex;justify-content:space-between;align-items:center;padding:2px 14px 8px;flex-shrink:0;position:relative;z-index:4;gap:8px}
.clpill{height:44px;border-radius:22px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.09),0 0 0 .5px rgba(0,0,0,.05);display:flex;align-items:center;gap:3px;padding:0 15px 0 9px;font-size:16.5px;font-weight:500;color:var(--ink);flex-shrink:0}
.clpill>svg{width:21px;height:21px}
.clpill.grp{padding:0 4px;gap:0}
.clpill.grp button{width:46px;height:44px;display:flex;align-items:center;justify-content:center}
.clpill.grp svg{width:23px;height:23px}
#phone.dark .clpill{background:#2c2c2e}
.clt{font-size:31px;font-weight:700;padding:2px 20px 8px;flex-shrink:0}
.clwd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;font-weight:500;padding-bottom:5px;flex-shrink:0;border-bottom:.5px solid var(--line)}
.clwd .we{color:var(--ink2)}
.clml{font-size:17px;font-weight:700;padding:16px 12px 8px}
.clrow{display:grid;grid-template-columns:repeat(7,1fr);border-top:.5px solid var(--line);height:88px}
.clm .clml+.clrow{border-top:0}
.clc{display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:5px;min-width:0;overflow:hidden}
.clc .n{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
.clc.we .n{color:var(--ink2);font-weight:500}

.bub.them{align-self:flex-start;background:#e9e9eb;color:#000}
#phone.dark .bub.them{background:#26252a;color:#fff}
.bub.img{padding:0;background:none!important;overflow:hidden;border-radius:16px;max-width:66%}
.bub.img img,.bub.img video{display:block;width:100%;border-radius:16px}
.bub.gap{margin-top:9px}
.readm{align-self:flex-end;font-size:11.5px;color:var(--ink2);margin:3px 4px 0}
.voice{display:flex;align-items:center;gap:8px;min-width:150px}
.voice .wv{flex:1;height:18px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 5px);opacity:.75;-webkit-mask:linear-gradient(90deg,#000 0 40%,rgba(0,0,0,.5) 60%,#000);border-radius:2px}
.inbar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 30px;flex-shrink:0;background:var(--bg)}
.inbar .plus{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink2);flex-shrink:0}
.inbar textarea{flex:1;border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:16.5px;resize:none;background:var(--bg);outline:none;max-height:110px;height:36px;line-height:1.25;color:var(--ink)}
.send{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:2px}
.whobtn{font-size:12px;padding:0 9px;height:36px;border-radius:18px;background:#ff9500;color:#fff;flex-shrink:0;font-weight:600;white-space:nowrap}
.thead{display:flex;flex-direction:column;align-items:center;position:absolute;left:0;right:0;top:0;pointer-events:none}
.thead .tn{font-size:11.5px;margin-top:3px;background:var(--fill);padding:2px 8px;border-radius:10px}
.picked{outline:3px solid #ff9500;outline-offset:-3px}
#dlgroot{position:fixed;inset:0;z-index:300;pointer-events:none;--bg:#fff;--bg2:#f2f2f7;--card:#fff;--ink:#000;--ink2:#8a8a8e;--line:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;--fill:rgba(118,118,128,.12);color:#000;font-size:17px}
#dlgroot>div{pointer-events:auto}
.tab{position:relative}
.mini{overflow:hidden;flex-shrink:0;position:relative}
.mini>div{transform-origin:0 0;position:absolute;left:0;top:0}
/* talk */
.tk{--tk-bg:#bacee0;--tk-me:#fee500;--tk-other:#fff}
#phone.dark .tk{--tk-bg:#2f3c4b;--tk-other:#3b3b3d}
.tk .tkhead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.tk .tkhead h1{font-size:21px;margin:0;font-weight:700}
.tkchips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto}
.tkchips button{border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.tkchips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tkad{margin:0 16px 8px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px}
.tkad img{width:56px;height:42px;object-fit:cover;border-radius:4px}
.tkrow{display:flex;gap:12px;padding:8px 16px;align-items:center;width:100%;text-align:left}
.tkrow .sq{width:48px;height:48px;border-radius:18px;flex-shrink:0;overflow:hidden;background:#9bbbd4;display:flex;align-items:center;justify-content:center;color:#fff}
.tkrow .sq img{width:100%;height:100%;object-fit:cover}
.tkrow .x{flex:1;min-width:0}
.tkrow .n{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkrow .n small{color:var(--ink2);font-weight:400;margin-left:4px}
.tkrow .p{font-size:13.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--ink2)}
.tkrow .u{background:#ff5d3a;color:#fff;border-radius:10px;padding:1px 6px;font-size:11.5px;font-weight:600}
.tkroom{background:var(--tk-bg)}
.tkroom .scroll{padding:6px 10px 12px}
.tkdate{text-align:center;margin:12px 0 8px}
.tkdate span{background:rgba(0,0,0,.18);color:#fff;font-size:11.5px;padding:4px 12px;border-radius:12px}
.tkm{display:flex;gap:7px;margin-top:3px;align-items:flex-start}
.tkm.me{justify-content:flex-end}
.tkm .pf{width:38px;height:38px;border-radius:15px;overflow:hidden;flex-shrink:0;background:#9bbbd4}
.tkm .pf img{width:100%;height:100%;object-fit:cover}
.tkm .sp{width:38px;flex-shrink:0}
.tkm .col{display:flex;flex-direction:column;max-width:72%}
.tkm .who{font-size:12.5px;margin:0 0 4px 2px;opacity:.85}
.tkm .ln{display:flex;align-items:flex-end;gap:4px}
.tkm.me .ln{flex-direction:row-reverse}
.tkb{background:var(--tk-other);color:var(--ink);padding:7px 10px;border-radius:4px 14px 14px 14px;font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.tkm.me .tkb{background:var(--tk-me);color:#000;border-radius:14px 4px 14px 14px}
.tkm.cont .tkb{border-radius:14px}
.tkb.img{padding:0;background:none!important;overflow:hidden;border-radius:12px!important}
.tkb.img img,.tkb.img video{display:block;max-width:220px;max-height:300px;border-radius:12px}
.tkmeta{font-size:10px;color:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;line-height:1.2}
#phone.dark .tkmeta{color:rgba(255,255,255,.55)}
.tkm:not(.me) .tkmeta{align-items:flex-start}
.tkmeta .un{color:#e6b800;font-weight:700}
.tklink{background:var(--tk-other);border-radius:12px;overflow:hidden;max-width:230px;font-size:13px}
.tklink div{padding:8px 10px}
.tkin{display:flex;align-items:center;gap:8px;padding:7px 10px 30px;background:var(--bg)}
.tkin textarea{flex:1;border:0;background:var(--fill);border-radius:18px;padding:8px 12px;font-size:15px;resize:none;height:36px;outline:none;color:var(--ink)}
.tkin .send{background:#fee500;color:#000}
.tkfr{display:flex;align-items:center;gap:12px;padding:8px 16px;width:100%;text-align:left}
.tkfr .sq{width:44px;height:44px;border-radius:17px;overflow:hidden;background:#9bbbd4;flex-shrink:0}
.tkfr .sq img{width:100%;height:100%;object-fit:cover}
.tkfr.mine .sq{width:58px;height:58px;border-radius:22px}
/* notes */
.nt{--nt-acc:#e5a800}
.nt .nb,.nt .ebar button{color:var(--nt-acc)}
.nyear{font-size:21px;font-weight:700;padding:16px 18px 8px}
.ncard{background:var(--card);border-radius:12px;margin:0 16px;overflow:hidden}
.nrow{display:block;width:100%;text-align:left;padding:10px 16px 0}
.nrow .bd{border-bottom:.5px solid var(--line);padding-bottom:10px}
.nrow:last-child .bd{border-bottom:0}
.nrow b{font-size:16px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .t2{font-size:14px}
.nrow .t2 em{font-style:normal;color:var(--ink)}
.nrow .fd{font-size:13px;color:var(--ink2);margin-top:2px}
.nbar{display:flex;gap:10px;align-items:center;padding:8px 16px 30px;flex-shrink:0}
.nbar .sbar{flex:1;margin:0;border-radius:20px}
.ndate{text-align:center;font-size:13px;color:var(--ink2);margin:4px 0 6px}
.ned{width:100%;border:0;outline:none;background:none;resize:none;padding:4px 20px;font-size:17px;line-height:1.45;color:var(--ink);flex-shrink:0}
.ntitle{font-size:26px;font-weight:700;width:100%;border:0;outline:none;background:none;padding:0 20px;color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;padding:5px 20px}
.chk i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:13px}
.chk.on i{background:var(--nt-acc);border-color:var(--nt-acc)}
.chk.on input{text-decoration:line-through;color:var(--ink2)}
.chk input{flex:1;border:0;background:none;outline:none;font-size:17px;color:var(--ink)}
.ebar{display:flex;justify-content:space-around;padding:8px 10px 30px;flex-shrink:0;border-top:.5px solid var(--line)}
.ebar button{padding:6px 10px;font-size:15px}
.ncol{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 8px}
.cal .wd{font-size:12px;color:var(--ink2);padding:4px 0 8px}
.cal button{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;font-size:18px;border-top:.5px solid var(--line)}
.cal button span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal button.today span{color:var(--red);font-weight:600}
.cal button.sel span{background:var(--ink);color:var(--bg);font-weight:600}
.cal button.sel.today span{background:var(--red);color:#fff}
.cal button.sun{color:var(--ink2)}
.cal button i{width:5px;height:5px;border-radius:50%;background:var(--ink2);margin-top:1px}
.evrow{display:flex;gap:10px;padding:10px 16px;width:100%;text-align:left;align-items:stretch}
.evrow .bar{width:4px;border-radius:2px;background:var(--red)}
.evrow .tm{font-size:13px;color:var(--ink2);width:52px;flex-shrink:0;padding-top:2px}
/* clock */
.bigclock{font-size:72px;font-weight:200;text-align:center;margin:40px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.cbtns{display:flex;justify-content:space-between;padding:0 24px;margin-bottom:20px}
.rbtn{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.rbtn.g{background:rgba(52,199,89,.2);color:#30d158}
.rbtn.r{background:rgba(255,59,48,.2);color:#ff453a}
.rbtn.n{background:var(--fill);color:var(--ink)}
.rbtn.o{background:rgba(255,149,0,.2);color:#ff9f0a}
.alrow{display:flex;align-items:center;padding:8px 18px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.alrow .tt{font-size:52px;font-weight:200;line-height:1.1}
.alrow .tt small{font-size:28px}
.alrow.off{color:var(--ink2)}
.tgl{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex-shrink:0;transition:background .2s}
.tgl::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.tgl.on{background:var(--green)}
.tgl.on::after{transform:translateX(20px)}
.tpick{display:flex;justify-content:center;gap:10px;margin:30px 0;align-items:center;font-size:20px}
.tpick select{font-size:30px;background:var(--fill);border:0;border-radius:10px;padding:6px 10px;color:var(--ink)}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pgrid button{aspect-ratio:1;position:relative;overflow:hidden;background:var(--fill)}
.pgrid img,.pgrid video{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .vd{position:absolute;right:5px;bottom:4px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.phtabs{position:absolute;left:16px;bottom:30px;display:flex;background:rgba(240,240,240,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;padding:5px;z-index:5;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#phone.dark .phtabs{background:rgba(50,50,52,.85)}
.phtabs button{display:flex;flex-direction:column;align-items:center;font-size:10.5px;padding:5px 16px;border-radius:24px;gap:1px}
.phtabs button.on{background:var(--fill);color:var(--blue)}
.phtabs svg{width:24px;height:24px}
.phsrch{position:absolute;right:16px;bottom:34px;width:54px;height:54px;border-radius:50%;background:rgba(240,240,240,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#phone.dark .phsrch{background:rgba(50,50,52,.85)}
.phhead{position:absolute;top:0;left:0;right:0;z-index:4;padding:50px 16px 22px;background:linear-gradient(rgba(0,0,0,.45),transparent);color:#fff;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.phhead>*{pointer-events:auto}
.phhead h1{margin:0;font-size:32px}
.phhead p{margin:0;font-size:13px;opacity:.85}
.phhead .pill{background:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.albums{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:0 16px}
.albums button{text-align:left}
.albums .cv{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--fill);margin-bottom:6px}
.albums .cv img{width:100%;height:100%;object-fit:cover}
#viewer{position:absolute;inset:0;z-index:76;background:#000;color:#fff;display:flex;flex-direction:column;animation:fade .2s}
#viewer .vtop,#viewer .vbot{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 12px;transition:opacity .2s}
#viewer .vtop{top:0;padding-top:50px;background:linear-gradient(rgba(0,0,0,.6),transparent);padding-bottom:16px}
#viewer .vbot{bottom:0;padding-bottom:34px;padding-top:20px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#viewer.hide .vtop,#viewer.hide .vbot{opacity:0;pointer-events:none}
#viewer .vbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#viewer .vbtn svg{width:21px;height:21px}
#viewer .vstage{flex:1;position:relative;overflow:hidden;touch-action:none}
#viewer .vstage img,#viewer .vstage video{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
#viewer .vt{text-align:center;font-size:14px;font-weight:600;line-height:1.25}
#viewer .vt small{display:block;font-weight:400;opacity:.8;font-size:12px}
#viewer .vdesc{position:absolute;left:16px;right:16px;bottom:100px;z-index:3;font-size:14px;line-height:1.4;background:rgba(0,0,0,.5);border-radius:12px;padding:10px 12px}
/* camera */
.cam{background:#000;color:#fff}
.cam .vf{flex:1;margin:96px 0 0;position:relative;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam .vf video,.cam .vf img{width:100%;height:100%;object-fit:cover}
.cam .vf p{position:absolute;color:#aaa;text-align:center;font-size:14px;padding:20px;line-height:1.5}
.cam .modes{display:flex;justify-content:center;gap:22px;font-size:13.5px;padding:14px 0;letter-spacing:.5px}
.cam .modes .on{color:#ffd60a}
.cam .ctl{display:flex;align-items:center;justify-content:space-between;padding:6px 34px 40px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;padding:4px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff}
.shutter:active i{transform:scale(.9)}
.cam .last{width:48px;height:48px;border-radius:8px;background:#333;overflow:hidden}
.cam .last img{width:100%;height:100%;object-fit:cover}
.cam .flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.flash{position:absolute;inset:0;background:#fff;z-index:9;animation:flash .3s forwards;pointer-events:none}
@keyframes flash{to{opacity:0}}
/* insta */
.ig .igh{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 6px}
.ig .logo{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Helvetica Neue",sans-serif;font-size:24px;font-weight:500;letter-spacing:-.4px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 12px 10px;border-bottom:.5px solid var(--line);scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;width:70px;flex-shrink:0}
.ring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#ffc107,#ff5722,#e91e63,#9c27b0,#ffc107)}
.ring.seen{background:var(--line)}
.ring>div{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);overflow:hidden;background:var(--fill)}
.ring img{width:100%;height:100%;object-fit:cover}
.story span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post{border-bottom:.5px solid var(--line);padding-bottom:12px}
.post .ph{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:14px;font-weight:600}
.post .ph small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--fill)}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;object-fit:cover;width:100%;display:block}
.igcar{background:var(--bg)}.igcar>*{aspect-ratio:var(--ar,4/5);object-fit:contain;background:var(--bg)}
.cdots{display:flex;justify-content:center;gap:4px;margin-top:-22px;position:relative;height:22px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--ink2);opacity:.5}
.cdots i.on{background:var(--blue);opacity:1}
.pacts{display:flex;gap:16px;padding:8px 12px 4px;align-items:center}
.pacts svg{width:26px;height:26px}
.pacts .liked{color:#ff3040}
.ptxt{padding:0 12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.ptxt .tag{color:#3f6ea6}
#phone.dark .ptxt .tag{color:#e0f1ff}
.pdate{padding:4px 12px 0;font-size:12px;color:var(--ink2)}
.prof{padding:4px 16px}
.prof .top{display:flex;align-items:center;gap:20px}
.prof .stats{flex:1;display:flex;justify-content:space-around;text-align:center;font-size:13px}
.prof .stats b{display:block;font-size:17px}
.prof .bio{font-size:14px;line-height:1.4;margin-top:10px;white-space:pre-wrap}
.prof .btns{display:flex;gap:6px;margin:12px 0}
.prof .btns button{flex:1;background:var(--fill);border-radius:8px;padding:7px;font-size:14px;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ggrid button{aspect-ratio:3/4;overflow:hidden;background:var(--fill);position:relative}
.ggrid img,.ggrid video{width:100%;height:100%;object-fit:cover}
.ggrid .multi{position:absolute;right:6px;top:6px;width:16px;height:16px;border:2px solid #fff;border-radius:3px;box-shadow:3px -3px 0 -1px rgba(255,255,255,.8)}
#storyv{position:absolute;inset:0;background:#000;z-index:77;color:#fff;animation:fade .2s}
#storyv .bars{position:absolute;top:10px;left:8px;right:8px;display:flex;gap:3px;z-index:3}
#storyv .bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
#storyv .bars i b{display:block;height:100%;background:#fff;width:0}
#storyv .who{position:absolute;top:22px;left:12px;display:flex;align-items:center;gap:8px;z-index:3;font-size:14px;font-weight:600}
#storyv .who small{font-weight:400;opacity:.7}
#storyv>img,#storyv>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#storyv .who .igav img{position:static;width:100%;height:100%;object-fit:cover}
#storyv .who small{font-weight:400;opacity:.75;margin-left:4px}
#storyv .x{position:absolute;top:20px;right:12px;z-index:4;font-size:26px}
/* translate */
.tr .tbox{padding:16px 20px;font-size:24px;min-height:120px;border:0;outline:none;width:100%;resize:none;background:none;color:var(--ink)}
.tr .lang{display:flex;align-items:center;gap:10px;padding:10px 16px}
.tr .lang select{flex:1;border:0;background:var(--fill);border-radius:22px;padding:11px;font-size:15px;text-align:center;color:var(--ink);-webkit-appearance:none;appearance:none;text-align-last:center}
.tr .res{margin:0 16px;border-radius:16px;background:#e8f0fe;padding:16px;font-size:21px;line-height:1.35;color:#174ea6}

const OV=()=>$('#overlay');
function layer(html,cls){const d=document.createElement('div');d.style.cssText='position:absolute;inset:0;pointer-events:auto';d.innerHTML=html;if(cls)d.className=cls;const adm=typeof ADM!=='undefined'&&ADM.on&&$('#admin').classList.contains('on');(adm?$('#dlgroot'):OV()).appendChild(d);return d}
function closeLayer(el){const l=el.closest?el.closest('#overlay>div,#dlgroot>div'):el;if(l)l.remove()}
function alertBox(t,m){return new Promise(ok=>{const l=layer(`<div class="dim"></div><div class="dlg"><div class="m"><b>${esc(t)}</b>${esc(m||'')}</div><div class="bs"><button>확인</button></div></div>`);l.querySelector('button').onclick=()=>{l.remove();ok()}})}
function confirmBox(t,m,ok='확인',danger){return new Promise(res=>{const l=layer(`<div class="dim"></div><div class="dlg"><div class="m"><b>${esc(t)}</b>${esc(m||'')}</div><div class="bs"><button data-v="0">취소</button><button data-v="1" class="${danger?'red':''}">${esc(ok)}</button></div></div>`);l.querySelectorAll('.bs button').forEach(b=>b.onclick=()=>{l.remove();res(b.dataset.v==='1')})})}
function promptBox(t,m,def=''){return new Promise(res=>{const l=layer(`<div class="dim"></div><div class="dlg"><div class="m"><b>${esc(t)}</b>${esc(m||'')}<input value="${esc(def)}"></div><div class="bs"><button data-v="0">취소</button><button data-v="1">확인</button></div></div>`);const i=l.querySelector('input');setTimeout(()=>i.focus(),50);l.querySelectorAll('.bs button').forEach(b=>b.onclick=()=>{l.remove();res(b.dataset.v==='1'?i.value:null)})})}
function actionSheet(title,items){const l=layer(`<div class="dim"></div><div class="asheet"><div class="g">${title?`<div class="h">${esc(title)}</div>`:''}${items.map((it,i)=>`<button data-i="${i}" class="${it.red?'red':''}">${esc(it.label)}</button>`).join('')}</div><div class="g"><button class="cc" data-i="-1">취소</button></div></div>`);l.querySelector('.dim').onclick=()=>l.remove();l.querySelectorAll('.asheet button').forEach(b=>b.onclick=()=>{l.remove();const it=items[+b.dataset.i];if(it)it.fn()})}

/* ================= 범용 입력 양식 ================= */
const FORMS={};
function contactOpts(none='(연락처 없음)'){return [['',none],...sortName(P.contacts).map(c=>[c.id,c.name||c.phone])]}
function sortName(a){return a.slice().sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ko'))}
function fieldHTML(fid,f,v){
 const k=esc(f.k),L=`<span>${esc(f.label)}</span>`,H=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
 switch(f.type){
  case 'textarea':return `<label class="fld">${L}<textarea data-k="${k}" rows="${f.rows||4}">${esc(v)}</textarea>${H}</label>`;
  case 'number':return `<label class="fld">${L}<input type="number" data-k="${k}" value="${esc(v)}" inputmode="decimal">${H}</label>`;
  case 'datetime':return `<label class="fld">${L}<input type="datetime-local" data-k="${k}" value="${esc(v)}">${H||'<div class="hint">과거 날짜도 자유롭게 정할 수 있어요.</div>'}</label>`;
  case 'date':return `<label class="fld">${L}<input type="date" data-k="${k}" value="${esc(v)}">${H}</label>`;
  case 'time':return `<label class="fld">${L}<input type="time" data-k="${k}" value="${esc(v)}">${H}</label>`;
  case 'color':return `<label class="fld">${L}<input type="color" data-k="${k}" value="${esc(v||'#ff3b30')}" style="width:60px;height:32px;border:0;background:none">${H}</label>`;
  case 'check':return `<label class="fld" style="display:flex;align-items:center;justify-content:space-between"><span style="margin:0;font-size:16px;color:inherit;opacity:1">${esc(f.label)}</span><input type="checkbox" data-k="${k}" ${v?'checked':''} style="width:22px;height:22px"></label>`;
  case 'select':{const o=typeof f.opts==='function'?f.opts():f.opts;return `<label class="fld">${L}<select data-k="${k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v??'')?'selected':''}>${esc(b)}</option>`).join('')}</select>${H}</label>`}
  case 'multi':{const o=typeof f.opts==='function'?f.opts():f.opts;const sel=v||[];return `<div class="fld">${L}<div data-k="${k}" data-multi="1">${o.map(([a,b])=>`<label style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:15px"><input type="checkbox" value="${esc(a)}" ${sel.includes(a)?'checked':''}>${esc(b)}</label>`).join('')||'<div class="hint">먼저 연락처를 추가하세요.</div>'}</div>${H}</div>`}
  case 'media':case 'medias':{const arr=f.type==='media'?(v?[v]:[]):(v||[]);return `<div class="fld">${L}<input type="hidden" data-k="${k}" data-media="${f.type}" value="${esc(JSON.stringify(arr))}"><div class="mrow" id="mp_${fid}_${k}">${mthumbs(fid,f.k,arr)}</div><div class="mrow" style="margin-top:6px"><button type="button" class="sbtn" onclick="X.fMedia('${fid}','${k}','up')">파일에서 선택</button><button type="button" class="sbtn" onclick="X.fMedia('${fid}','${k}','lib')">사진첩에서</button>${f.type==='media'&&arr.length?`<button type="button" class="sbtn red" onclick="X.fMedia('${fid}','${k}','del')">지우기</button>`:''}</div>${H}</div>`}
  default:return `<label class="fld">${L}<input type="text" data-k="${k}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${H}</label>`;
 }
}
function mthumbs(fid,k,arr){return arr.map((r,i)=>`<div style="position:relative">${isVid(r)?`<video class="mthumb" src="${esc(murl(r))}" muted playsinline></video>`:`<img class="mthumb" src="${esc(murl(r))}" alt="">`}${arr.length>1||FORMS[fid]?.fields.find(f=>f.k===k)?.type==='medias'?`<button type="button" onclick="X.fMediaRm('${fid}','${k}',${i})" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff3b30;color:#fff;font-size:12px">✕</button>`:''}</div>`).join('')}
function formBody(fid,fields,data){return fields.map(f=>f.type==='head'?`<div class="grph" style="padding:14px 16px 6px">${esc(f.label)}</div>`:fieldHTML(fid,f,data[f.k])).join('')}
function readForm(root,fields){const o={};fields.forEach(f=>{if(f.type==='head')return;const el=root.querySelector(`[data-k="${f.k}"]`);if(!el)return;
 if(f.type==='check')o[f.k]=el.checked;else if(f.type==='number')o[f.k]=el.value===''?0:+el.value;else if(f.type==='multi')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);else if(el.dataset.media){const a=JSON.parse(el.value||'[]');o[f.k]=f.type==='media'?(a[0]||''):a}else o[f.k]=el.value});return o}
/* 휴대폰 화면 안에서 열리는 편집 시트 */
function sheetForm({title,fields,data={},onSave,onDelete,saveLabel='저장',extra=''}){if(VIEWER){toast(VMSG);return}
 const fid='f'+uid();const l=layer(`<div class="dim"></div><div class="sheet"><div class="nav"><button class="nb" data-x="c">취소</button><div class="ttl">${esc(title)}</div><button class="nb" data-x="s" style="font-weight:600">${esc(saveLabel)}</button></div><div class="scroll" style="padding:14px 0 40px"><div class="grp" id="${fid}">${formBody(fid,fields,data)}</div>${extra}${onDelete?`<div class="grp"><button class="row" data-x="d" style="color:var(--red);justify-content:center;min-height:46px">삭제</button></div>`:''}</div></div>`);
 FORMS[fid]={fields,root:l};
 l.querySelector('[data-x=c]').onclick=()=>{l.remove();delete FORMS[fid]};
 l.querySelector('[data-x=s]').onclick=()=>{const d=readForm(l,fields);if(onSave(d)===false)return;l.remove();delete FORMS[fid];save();refresh()};
 const del=l.querySelector('[data-x=d]');if(del)del.onclick=async()=>{if(await confirmBox('삭제할까요?','삭제하면 되돌릴 수 없습니다.','삭제',true)){onDelete();l.remove();delete FORMS[fid];save();refresh()}};
 return l;
}
/* 사진첩에서 고르기 */
function pickFromPhotos(multi){return new Promise(res=>{
 const ps=P.photos;const chosen=[];
 const l=layer(`<div class="dim"></div><div class="sheet"><div class="nav"><button class="nb" data-x="c">취소</button><div class="ttl">사진 선택</div><button class="nb" data-x="s" style="font-weight:600">추가</button></div><div class="scroll">${ps.length?`<div class="pgrid">${ps.map((p,i)=>`<button data-i="${i}">${mediaTag(p.src)}</button>`).join('')}</div>`:'<div class="empty">사진첩이 비어 있어요.<br>사진 앱에서 먼저 사진을 추가하세요.</div>'}</div></div>`);
 l.querySelectorAll('.pgrid button').forEach(b=>b.onclick=()=>{const r=ps[+b.dataset.i].src;if(!multi){l.remove();res([r]);return}const j=chosen.indexOf(r);if(j>=0){chosen.splice(j,1);b.classList.remove('picked')}else{chosen.push(r);b.classList.add('picked')}});
 l.querySelector('[data-x=c]').onclick=()=>{l.remove();res([])};l.querySelector('[data-x=s]').onclick=()=>{l.remove();res(chosen)};
})}
const X={}; // 화면 버튼에서 부르는 함수 모음
X.fMedia=async(fid,k,how)=>{const F=FORMS[fid];if(!F)return;const inp=F.root.querySelector(`[data-k="${k}"]`);const f=F.fields.find(x=>x.k===k);let arr=JSON.parse(inp.value||'[]');
 if(how==='del')arr=[];else{const got=how==='up'?await uploadMedia(f.accept||'image/*,video/*',f.type==='medias'):await pickFromPhotos(f.type==='medias');if(!got.length)return;arr=f.type==='media'?[got[0]]:arr.concat(got)}
 inp.value=JSON.stringify(arr);F.root.querySelector(`#mp_${fid}_${k}`).innerHTML=mthumbs(fid,k,arr)};
X.fMediaRm=(fid,k,i)=>{const F=FORMS[fid];const inp=F.root.querySelector(`[data-k="${k}"]`);const arr=JSON.parse(inp.value||'[]');arr.splice(i,1);inp.value=JSON.stringify(arr);F.root.querySelector(`#mp_${fid}_${k}`).innerHTML=mthumbs(fid,k,arr)};

function renderStatus(){const d=nowD();const s=$('#status');s.innerHTML=`<span>${d.getHours()}:${pad(d.getMinutes())}</span><span class="r">${P.carrier?`<span style="font-size:14px">${esc(P.carrier)}</span>`:`<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>`}<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.6 10.6 0 008 .3 10.6 10.6 0 00.5 3.4l1.3 1.3A8.7 8.7 0 018 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.3-1.3A7.2 7.2 0 008 3.9 7.2 7.2 0 003 5.9l1.3 1.3c1-.9 2.3-1.4 3.7-1.4zM8 9.2l2-2a2.9 2.9 0 00-4 0z"/></svg><span class="bat"><i style="width:${Math.max(4,Math.min(100,P.battery))}%;${P.battery<=20?'background:#ff3b30':''}"></i></span></span>`}
function renderHome(){
 const wall=$('#wall');const wu=murl(P.wallpaper);wall.style.background=wu?`#000 url("${wu}") center/cover no-repeat`:`linear-gradient(170deg,${P.wallColor},#000)`;
 const ap=Object.entries(P.apps).filter(([k])=>k!=='search'&&k!=='contacts'&&!(VIEWER&&k==='settings'));
 const pages=['p1','p2','p3'].map(pg=>ap.filter(([,a])=>a.loc===pg).sort((x,y)=>x[1].order-y[1].order)).filter((a,i)=>a.length||i===0);
 const cell=([k,a])=>`<button class="app" onclick="X.tapApp('${k}')">${appIcon(k)}${a.badge?`<span class="badge">${a.badge>999?'999+':a.badge}</span>`:''}<span class="lbl">${esc(a.name)}</span></button>`;
 $('#pages').innerHTML=pages.map(pg=>`<div class="hpage">${pg.map(cell).join('')}</div>`).join('');
 $('#dots').innerHTML=pages.length>1?pages.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join(''):'';
 $('#dock').innerHTML=ap.filter(([,a])=>a.loc==='dock').sort((x,y)=>x[1].order-y[1].order).slice(0,4).map(cell).join('');
 let fab=$('#editfab');if(!fab){fab=document.createElement('button');fab.id='editfab';$('#home').appendChild(fab);fab.onclick=()=>admOpen()}
 fab.style.display=P.editFab?'':'none';fab.innerHTML=`✎ 편집${ED()?' · 켜짐':''}`;
 $('#phone').classList.toggle('dark',!!P.dark);
 renderStatus();
}
$('#pages').addEventListener('scroll',()=>{const p=$('#pages');const i=Math.round(p.scrollLeft/p.clientWidth);$$('#dots i').forEach((d,j)=>d.classList.toggle('on',i===j))});
$('#spot').onclick=()=>{};
X.tapApp=k=>{if(k==='camera')return;openApp(k)};
function showBanner(){$('#banner').classList.remove('show');return;const b=P.banner;const el=$('#banner');if(!b||!b.show){el.classList.remove('show');return}
 el.innerHTML=`<div class="bi">${b.photo?`<img src="${esc(murl(b.photo))}" alt="">`:miniIcon(b.app,38)}${b.photo?`<div class="sm">${miniIcon(b.app,17)}</div>`:''}</div><div style="flex:1;min-width:0"><b>${esc(b.title)}</b><p>${esc(b.text)}</p></div><span class="t">지금</span>`;
 setTimeout(()=>el.classList.add('show'),400);
 el.onclick=()=>{el.classList.remove('show');if(b.app==='talk'&&b.room&&P.talk.rooms.find(r=>r.id===b.room))openApp('talk','room',{id:b.room});else openApp(b.app)};
 let sy;el.ontouchstart=e=>sy=e.touches[0].clientY;el.ontouchmove=e=>{if(e.touches[0].clientY-sy<-20)el.classList.remove('show')};
}

   body=`<div class="phnav"><button class="phpill" onclick="X.phEdit()">${A.editing?'완료':'편집'}</button><div class="phseg"><button class="${A.filter!=='missed'?'on':''}" onclick="X.pfilter('all')">모두</button><button class="${A.filter==='missed'?'on':''}" onclick="X.pfilter('missed')">부재중 전화</button></div><button class="phpill r" onclick="${own?'X.phCfg()':''}">${PHI.filter}</button></div><div class="scroll"><div class="phlarge">최근 통화</div>${A.editing&&own?`<button class="phadd" onclick="X.addCall()">+ 통화 기록 추가</button>`:''}${cfg.screen&&!A.scrHide?`<div class="phscr"><button class="x" onclick="APPS.phone.scrHide=1;this.parentNode.remove()">✕</button><div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:26px;color:#0a84ff">☎︎</span><div><b>알 수 없는 발신자 스크리닝</b><p>전화벨이 울리기 전에 누가 전화를 걸었는지 묻습니다. 통화 및 데이터 요금이 적용될 수 있습니다.</p></div></div><button class="go">통화 스크리닝</button></div>`:''}<div class="phlist">${phCallRows(l)||'<div class="empty">통화 기록이 없습니다.</div>'}</div><div style="height:110px"></div></div>`}
  else if(A.tab==='fav'){const f=P.contacts.filter(c=>c.fav);body=`<div class="phnav"><span style="width:44px"></span><b>즐겨찾기</b><button class="phpill r" onclick="${own?'X.phFavAdd()':''}">${G.plus}</button></div><div class="scroll">${!A.favHide?`<div class="phtip"><b>즐겨찾기에 연락처 추가하기</b><span>자주 통화하는 연락처를 추가해 보세요.</span><button onclick="APPS.phone.favHide=1;this.parentNode.remove()">✕</button></div>`:''}${f.length?`<div class="phlist">${f.map(c=>`<div class="phr"><button class="phrm" onclick="startCall('${c.id}')">${phAv(c.photo,c.name,40)}<span class="tx"><b>${esc(c.name)}</b><small>휴대전화</small></span></button><button class="phinfo" onclick="push('contact',{id:'${c.id}'})">i</button></div>`).join('')}</div>`:'<div class="phnone">즐겨찾기 없음</div>'}<div style="height:110px"></div></div>`}
  else if(A.tab==='contacts'){const list=sortName(P.contacts);const groups={};list.forEach(c=>{(groups[initial(c.name)]=groups[initial(c.name)]||[]).push(c)});
   body=`<div class="phnav"><span style="width:44px"></span><b>연락처</b><button class="phpill r" onclick="${own?'X.addContact()':''}">${G.plus}</button></div><div class="sbar" style="margin:4px 16px 8px">${G.search}<input placeholder="검색" oninput="X.filt(this,'.phcl .phr')" autocomplete="off"><span style="width:17px;display:flex">${G.mic}</span></div><div class="scroll phcl"><button class="phr phme" onclick="X.myCard()">${phAv(P.ownerPhoto,'',40)}<span class="tx"><b style="font-weight:400;color:var(--ink2)">내 카드</b></span></button>${Object.entries(groups).map(([g,cs])=>`<div class="phidx">${g}</div>${cs.map(c=>`<button class="phr" data-s="${esc(c.name+' '+(c.phone||''))}" onclick="push('contact',{id:'${c.id}'})">${phAv(c.photo,c.name,40)}<span class="tx"><b style="font-weight:400">${esc(c.name||c.phone)}</b></span></button>`).join('')}`).join('')||'<div class="empty">연락처가 없습니다.</div>'}<div style="height:110px"></div></div>`}
  else if(A.tab==='keypad'){body=`<div class="phnav"><span class="phsim">${esc(cfg.sim||'메인')} ◇</span>${own?`<button class="phpill" onclick="X.dialMenu()">자막 설정</button>`:'<span></span>'}</div><div class="phkp"><div id="kpv" class="kpv">${esc(A.kp)}</div><div class="keys">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(([d,s])=>`<button class="key" onclick="X.kp('${d}')">${d}<small>${s}</small></button>`).join('')}<span></span><button class="callgo" onclick="X.kpCall()">${PHI.phone}</button><button id="kpdel" class="kdel" style="visibility:${A.kp?'visible':'hidden'}" onclick="X.kp('del')">⌫</button></div></div>`}
  else{const vms=phVms().slice().sort((a,b)=>String(b.date).localeCompare(a.date));body=`<div class="phnav"><button class="phpill" onclick="X.phEdit()">${A.editing?'완료':'편집'}</button><span></span><button class="phpill" onclick="${own?'X.phCfg()':''}">인사말</button></div><div class="scroll"><div class="phlarge">음성 메시지</div>${A.editing&&own?`<button class="phadd" onclick="X.vmAdd()">+ 음성 메시지 추가</button>`:''}<div class="phcarrier"><span>이동통신사 음성 사서함</span><b>이동통신사에 전화</b></div><div class="phlist">${vms.map(v=>{const ct=contact(v.contactId);const nm=ct?ct.name:(v.number||'알 수 없음');return `<div class="phr vm">${A.editing&&own?`<button class="phdel" onclick="X.vmEdit('${v.id}')">−</button>`:''}<button class="phrm" onclick="X.vmPlay('${v.id}')">${phAv(ct?.photo,nm,40)}<span class="tx"><b>${esc(nm)}</b><small class="tr">“${esc(v.text||'')}”</small></span><span class="tm2"><span>${esc(phTime(v.date))}</span><span>${esc(v.dur||'')}</span></span></button><button class="phinfo" onclick="${own?`X.vmEdit('${v.id}')`:`X.vmPlay('${v.id}')`}">i</button></div>`}).join('')}</div>${+cfg.delVm?`<div class="phlist" style="margin-top:14px"><div class="phr"><span class="tx" style="padding:12px 0"><b style="font-weight:400">삭제된 음성 메시지</b></span><span class="tm" style="padding-right:4px">${+cfg.delVm} ›</span></div></div>`:''}${vms.length?'':'<div class="phnone" style="margin-top:80px">음성 메시지 없음</div>'}<div style="height:110px"></div></div>`}
  return topPad+body+phTabbar()},
 contact:p=>contactDetailHTML(p.id)
}};
X.phFavAdd=()=>actionSheet('즐겨찾기에 추가',sortName(P.contacts).filter(c=>!c.fav).slice(0,12).map(c=>({label:c.name,fn:()=>{c.fav=true;save();refresh()}})));
X.vmPlay=id=>{const v=byId(phVms(),id);if(!v)return;const ct=contact(v.contactId);alertBox(ct?ct.name:(v.number||'음성 메시지'),`${phTime(v.date)} · ${v.dur||''}\n\n“${v.text||''}”`)};
/* 가상 통화 화면 (자막 포함) */
let callT,subT=[],callAU=null;
function phParse(lines){return String(lines||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{let sec=0;const m=l.match(/^\[(\d+(?:\.\d+)?)\]\s*/);if(m){sec=+m[1];l=l.slice(m[0].length)}const i=l.indexOf(':');const who=i>0&&i<14?l.slice(0,i).trim():'';const t=who?l.slice(i+1).trim():l;return{who,t,sec:sec||Math.max(2.2,Math.min(7,t.length*.17))}})}
function startCall(cid,num,video){const ct=contact(cid);const n=num||ct?.phone||'';const sc=digits(n)&&phScripts().find(d=>digits(d.number)===digits(n));
 const name=sc&&sc.name?sc.name:ct?ct.name:(n||'알 수 없음');const photo=sc&&sc.photo?sc.photo:ct?.photo;
 endCall(true);const d=document.createElement('div');d.id='callscr';const ph=murl(photo);if(ph)d.style.backgroundImage=`url("${ph}")`;
 const btn=(ic,l,cls='')=>`<button class="cb ${cls}" onclick="this.classList.toggle('on')"><i>${ic}</i>${l}</button>`;
 const sim=esc(phCfg().sim||'');d.className=ph?'hasph':'';
 d.innerHTML=`<div class="cs">${sim?`<em>${sim}</em> `:''}<span id="cst">${video?'FaceTime 연결 중...':'휴대전화 연결 중...'}</span></div><div class="cn">${esc(name)}</div><div class="csub" id="csub"></div><div class="cg">${btn('<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4.5v15L7 15H3z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>','오디오')}${btn('<svg viewBox="0 0 24 24"><rect x="2" y="6.5" width="14" height="11" rx="2.5" fill="currentColor" opacity=".55"/><path d="M17 10.5l5-3v9l-5-3z" fill="currentColor" opacity=".55"/><text x="9" y="15.2" font-size="9" font-weight="700" text-anchor="middle" fill="#3a3a3a">?</text></svg>','FaceTime')}${btn('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7M4 4l16 16"/></svg>','소리 끔')}${btn('<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>','더 보기')}<button class="cb" onclick="endCall()"><i class="end"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3.2 14.6c-.6-.6-.6-1.6 0-2.2C5.7 10 8.8 8.8 12 8.8s6.3 1.2 8.8 3.6c.6.6.6 1.6 0 2.2l-1.4 1.4c-.5.5-1.3.5-1.8.1l-2-1.6c-.4-.3-.6-.8-.5-1.3l.2-1.3c-2.1-.7-4.5-.7-6.6 0l.2 1.3c.1.5-.1 1-.5 1.3l-2 1.6c-.5.4-1.3.4-1.8-.1z"/></svg></i>종료</button>${btn('<svg viewBox="0 0 24 24" fill="currentColor">'+[5,12,19].map(x=>[4.5,10.5,16.5].map(y=>`<circle cx="${x}" cy="${y}" r="2.6"/>`).join('')).join('')+'</svg>','키패드')}</div>`;
 $('#phone').appendChild(d);
 const res=sc?sc.result:'answer';const ring=(sc?(+sc.ring||4):2.2)*1000;phRing(true);
 let au=null;if(sc&&sc.audio&&res!=='noanswer'){try{au=new Audio(murl(sc.audio));au.preload='auto';au.playsInline=true;au.muted=true;callAU=au;const pr=au.play();if(pr&&pr.then)pr.then(()=>{if(callAU===au&&au.muted){au.pause();au.currentTime=0}}).catch(()=>{})}catch(e){au=null}}
 const playAU=()=>{if(!au)return;au.muted=false;try{au.currentTime=0}catch(e){}au.play().catch(()=>{});if(!sc||sc.endAfter!==false)au.onended=()=>setTimeout(endCall,1000)};
 const say=(arr,after)=>{let t=0;arr.forEach((ln,i)=>{subT.push(setTimeout(()=>{const el=$('#csub');if(!el)return;el.innerHTML=`${ln.who?`<b>${esc(ln.who)}</b>`:''}<span>${esc(ln.t)}</span>`;el.classList.remove('in');void el.offsetWidth;el.classList.add('in')},t));t+=ln.sec*1000});subT.push(setTimeout(()=>{const el=$('#csub');if(el)el.classList.remove('in');if(after)after()},t))};
 if(res==='noanswer')return;
 subT.push(setTimeout(()=>{if(!$('#callscr'))return;phRing(false);
  if(res==='off'||res==='vm'){$('#cst').textContent=res==='off'?'연결할 수 없음':'음성사서함';const def=res==='off'?[{who:'',t:'고객님의 전화기가 꺼져 있어 음성사서함으로 연결되며, 통화료가 부과됩니다.',sec:5}]:[{who:'',t:'지금은 전화를 받을 수 없습니다. 삐 소리가 나면 음성 메시지를 남겨 주세요.',sec:5}];playAU();const ls=sc&&sc.lines?phParse(sc.lines):(au?[]:def);say(ls,()=>{if(!au&&(!sc||sc.endAfter!==false))setTimeout(endCall,800)});return}
  let s=0;callT=setInterval(()=>{s++;const el=$('#cst');if(el)el.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`},1000);$('#cst').textContent='00:00';
  playAU();if(sc&&sc.lines)say(phParse(sc.lines),()=>{if(!au&&sc.endAfter!==false)setTimeout(endCall,1200)})},ring))}
function endCall(silent){clearInterval(callT);phRing(false);if(callAU){try{callAU.onended=null;callAU.pause()}catch(e){}callAU=null}subT.forEach(clearTimeout);subT=[];const d=$('#callscr');if(d){if(silent){d.remove();return}const c=$('#cst');if(c)c.textContent='통화 종료';$('#csub')?.classList.remove('in');setTimeout(()=>d.remove(),700)}inkBars()}

/* ================= 연락처 ================= */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function initial(n){n=String(n||'').trim();const c=n.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const i=Math.floor((c-0xAC00)/588);return 'ㄱㄱㄴㄷㄷㄹㅁㅂㅂㅅㅅㅇㅈㅈㅊㅋㅌㅍㅎ'[i]}const ch=n[0]?.toUpperCase();return /[A-Z]/.test(ch||'')?ch:'#'}
function contactsListHTML(from){const list=sortName(P.contacts);const groups={};list.forEach(c=>{(groups[initial(c.name)]=groups[initial(c.name)]||[]).push(c)});
 return `${navBar({back:from!=='phone'&&false,right:`<button class="nb" onclick="X.addContact()">${G.plus}</button>`})}<div class="scroll"><div class="large">연락처</div>${sbar('검색','cq','',"X.filt(this,'#clist .row')")}<button class="row" onclick="X.myCard()" style="padding-bottom:8px">${avatar(P.ownerPhoto,P.owner,58)}<div class="bd"><div class="t1" style="font-weight:600;font-size:19px">${esc(P.owner)}</div><div class="t2">내 카드</div></div></button><div id="clist">${Object.entries(groups).map(([g,cs])=>`<div class="idx">${g}</div><div class="list">${cs.map(c=>`<button class="row" data-s="${esc((c.name||'')+' '+(c.phone||''))}" onclick="push('contact',{id:'${c.id}'})"><div class="bd"><div class="t1">${esc(c.name||c.phone)}</div></div></button>`).join('')}</div>`).join('')||'<div class="empty">연락처가 없습니다.<br>오른쪽 위 +를 눌러 추가하세요.</div>'}</div><div class="t2" style="text-align:center;padding:16px">${P.contacts.length}개의 연락처</div></div>`}
const contactFields=[{k:'name',label:'이름'},{k:'phone',label:'전화번호'},{k:'photo',label:'프로필 사진',type:'media',accept:'image/*'},{k:'memo',label:'메모',type:'textarea',rows:3},{k:'tstatus',label:'톡 상태메시지'},{k:'bday',label:'생일 (예: 03-14, 톡 친구 탭에 표시)'},{k:'tupd',label:'톡 \'업데이트 프로필\'에 표시 (빨간 점)',type:'check'},{k:'cover',label:'톡 프로필 배경 사진',type:'media',accept:'image/*'},{k:'fav',label:'즐겨찾기',type:'check'}];
X.addContact=(pre={})=>sheetForm({title:'새로운 연락처',fields:contactFields,data:{name:'',phone:'',...pre},saveLabel:'완료',onSave:d=>{if(!d.name&&!d.phone){toast('이름이나 번호를 입력하세요');return false}P.contacts.push({id:uid(),...d})}});
X.editContact=id=>{const c=contact(id);sheetForm({title:'연락처 편집',fields:contactFields,data:c,saveLabel:'완료',onSave:d=>Object.assign(c,d),onDelete:()=>{P.contacts.splice(P.contacts.indexOf(c),1);back()}})};
X.myCard=()=>sheetForm({title:'내 카드',fields:[{k:'owner',label:'이름 (휴대폰 주인)'},{k:'ownerPhone',label:'내 번호'},{k:'ownerPhoto',label:'프로필 사진',type:'media',accept:'image/*'},{k:'ownerMemo',label:'메모',type:'textarea'}],data:P,onSave:d=>Object.assign(P,d)});
function contactDetailHTML(id){const c=contact(id);if(!c)return topPad+navBar()+'<div class="empty">삭제된 연락처입니다.</div>';
 const calls=P.calls.filter(x=>x.contactId===id).sort((a,b)=>String(b.date).localeCompare(a.date)).slice(0,6);
 const room=P.talk.rooms.find(r=>!r.name&&r.members.length===1&&r.members[0]===id);const ig=P.insta.accounts.find(a=>a.contactId===id);
 return topPad+navBar({right:`<button class="nb" onclick="X.editContact('${id}')">편집</button>`})+`<div class="scroll" style="background:var(--bg2)"><div class="chero">${avatar(c.photo,c.name,110)}<div class="nm">${esc(c.name)}</div></div><div class="cacts"><button class="cact" onclick="X.smsTo('${id}')">${G.msg}메시지</button><button class="cact" onclick="startCall('${id}')">${G.phone}전화</button><button class="cact" onclick="startCall('${id}','',1)">${G.video}영상</button><button class="cact" onclick="X.talkTo('${id}')">${G.msg.replace('currentColor','#3a1d1d').replace('<svg','<svg style="background:#fee500;border-radius:6px;padding:2px"')}톡</button></div>
 <div class="grp"><div class="row"><div class="bd"><div class="t2" style="font-size:13px">휴대전화</div><div class="t1" style="color:var(--blue)">${esc(c.phone||'-')}</div></div></div></div>
 ${c.memo?`<div class="grp"><div class="row"><div class="bd"><div class="t2" style="font-size:13px">메모</div><div style="white-space:pre-wrap;font-size:16px">${esc(c.memo)}</div></div></div></div>`:''}
 ${calls.length?`<div class="grph">최근 통화</div><div class="grp">${calls.map(x=>`<div class="row"><div class="bd"><div class="t1" style="font-size:15px;${x.type==='missed'?'color:var(--red)':''}">${esc(kday(x.date))} ${hm(x.date)}</div><div class="t2">${x.type==='missed'?'부재중 전화':x.type==='out'?'발신 통화':'수신 통화'} ${esc(x.dur||'')}</div></div></div>`).join('')}</div>`:''}
 <div class="grp"><button class="row" onclick="X.smsTo('${id}')"><div class="bd" style="color:var(--blue)">문자 대화 보기</div></button><button class="row" onclick="X.talkTo('${id}')"><div class="bd" style="color:var(--blue)">톡 대화 보기</div></button>${ig?`<button class="row" onclick="openApp('insta','profile',{id:'${ig.id}'})"><div class="bd" style="color:var(--blue)">${esc(P.apps.insta.name)} 프로필 (@${esc(ig.username)})</div></button>`:''}<button class="row" onclick="X.toggleFav('${id}')"><div class="bd" style="color:var(--blue)">${c.fav?'즐겨찾기에서 제거':'즐겨찾기에 추가'}</div></button></div></div>`}
X.toggleFav=id=>{const c=contact(id);c.fav=!c.fav;save();refresh()};
APPS.contacts={q:'',views:{main:()=>topPad+contactsListHTML('contacts'),contact:p=>contactDetailHTML(p.id)}};

/* ================= 메시지 (문자) ================= */
const smsName=t=>{const c=contact(t.contactId);return c?c.name:(t.name||t.number||'이름 없음')};
const smsPhoto=t=>{const c=contact(t.contactId);return c?c.photo:t.photo};
const lastMsg=t=>t.msgs[t.msgs.length-1];
function preview(m){if(!m)return'';if(m.type==='deleted')return m.text||'메시지가 삭제되었습니다.';return m.type==='image'?'사진':m.type==='video'?'동영상':m.type==='voice'?'음성 메시지':m.text||''}
X.smsTo=(cid,num)=>{let t=P.sms.find(x=>cid?x.contactId===cid:x.number===num);if(!t){t={id:uid(),contactId:cid||'',name:'',number:num||'',photo:'',readLabel:'읽음',unread:false,msgs:[]};P.sms.push(t);save()}openApp('messages','thread',{id:t.id})};
X.smsNew=()=>actionSheet('누구에게 보낼까요?',[...sortName(P.contacts).slice(0,12).map(c=>({label:c.name,fn:()=>X.smsTo(c.id)})),{label:'번호 직접 입력',fn:async()=>{const n=await promptBox('새로운 메시지','받는 사람 번호');if(n)X.smsTo('',n)}}]);

function smsBubbles(t){let out='',prev=null;const n=t.msgs.length;
 t.msgs.forEach((m,i)=>{const d=pd(m.date),pdv=prev&&pd(prev.date);const gap=!prev||!d||!pdv||!sameDay(d,pdv)||(d-pdv)>3600e3;

X.phSelAct=a=>{const A=APPS.photos;const ids=A.sel.slice();if(!ids.length){toast('항목을 먼저 고르세요');return}
 if(a==='del')confirmBox(`${ids.length}개 항목을 삭제할까요?`,'메시지나 게시물에 쓰인 사진은 그대로 남습니다.','삭제',true).then(ok=>{if(!ok)return;P.photos=P.photos.filter(p=>!ids.includes(p.id));A.sel=[];A.selMode=false;save();render('',true)});
 else if(a==='album')actionSheet('앨범에 추가',[...P.albums.map(al=>({label:al.name,fn:()=>{ids.forEach(id=>{const p=byId(P.photos,id);p.albums=p.albums||[];if(!p.albums.includes(al.id))p.albums.push(al.id)});save();toast(`'${al.name}'에 추가했어요`);A.selMode=false;A.sel=[];render('',true)}})),{label:'새로운 앨범…',fn:async()=>{const n=await promptBox('새로운 앨범','앨범 이름');if(!n)return;const al={id:uid(),name:n};P.albums.push(al);ids.forEach(id=>{const p=byId(P.photos,id);(p.albums=p.albums||[]).push(al.id)});save();A.selMode=false;A.sel=[];render('',true)}}]);
 else if(a==='fwd'||a==='bk'){ids.forEach(id=>{const i=P.photos.findIndex(p=>p.id===id);const j=a==='fwd'?i-1:i+1;if(j>=0&&j<P.photos.length)[P.photos[i],P.photos[j]]=[P.photos[j],P.photos[i]]});save();render('',true)}};
X.albAdd=async()=>{const n=await promptBox('새로운 앨범','이 앨범의 이름을 입력하십시오.');if(n){P.albums.push({id:uid(),name:n});save();refresh()}};
X.albMenu=id=>{const al=byId(P.albums,id);actionSheet(al.name,[{label:'사진 추가 (파일)',fn:()=>X.phAdd(id)},{label:'보관함에서 추가',fn:async()=>{const r=await pickFromPhotos(true);r.forEach(src=>{const p=P.photos.find(x=>x.src===src);if(p){p.albums=p.albums||[];if(!p.albums.includes(id))p.albums.push(id)}});save();refresh()}},{label:'앨범 이름 변경',fn:async()=>{const n=await promptBox('앨범 이름 변경','',al.name);if(n){al.name=n;save();refresh()}}},{label:'앨범 삭제 (사진은 남음)',red:true,fn:async()=>{if(await confirmBox('앨범을 삭제할까요?','사진은 보관함에 남습니다.','삭제',true)){P.albums.splice(P.albums.indexOf(al),1);P.photos.forEach(p=>p.albums=(p.albums||[]).filter(x=>x!==id));save();back()}}}])};
function phGrid(list,ctx){const A=APPS.photos;return `<div class="pgrid">${list.map(p=>`<button onclick="X.phTap('${p.id}','${ctx}')" class="${A.selMode&&A.sel.includes(p.id)?'picked':''}">${mediaTag(p.src)}${isVid(p.src)?'<span class="vd">▶</span>':''}${p.fav?'<span class="vd" style="left:5px;right:auto">♥</span>':''}${A.selMode&&A.sel.includes(p.id)?'<span style="position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff">✓</span>':''}</button>`).join('')}</div>`}
function phSelBar(){const A=APPS.photos;return A.selMode?`<div style="position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 32px;font-size:14px;color:var(--blue)"><button onclick="X.phSelAct('album')">앨범에 추가</button><button onclick="X.phSelAct('fwd')">◀ 앞으로</button><button onclick="X.phSelAct('bk')">뒤로 ▶</button><button style="color:var(--red)" onclick="X.phSelAct('del')">삭제</button></div>`:''}
APPS.photos={tab:'lib',selMode:false,sel:[],views:{
 main(){const A=APPS.photos;
  const tabs=A.selMode?'':`<div class="phtabs"><button class="${A.tab==='lib'?'on':''}" onclick="X.phTab('lib')">${G.photo}보관함</button><button class="${A.tab==='alb'?'on':''}" onclick="X.phTab('alb')">${G.stack}모음</button></div><button class="phsrch" onclick="X.phFind()">${G.search.replace('<svg','<svg style="width:22px;height:22px"')}</button>`;
  if(A.tab==='lib')return `<div class="phhead" style="${P.photos.length?'':'color:var(--ink);background:none'}"><div><h1>보관함</h1><p>${P.photos.length}개의 항목</p></div><div style="display:flex;gap:6px;margin-top:4px"><button class="pill" style="${P.photos.length?'':'color:var(--blue);background:var(--fill)'}" onclick="X.phAdd()">추가</button><button class="pill" style="${P.photos.length?'':'color:var(--blue);background:var(--fill)'}" onclick="X.phSel()">${A.selMode?'취소':'선택'}</button></div></div><div class="scroll" id="phs">${P.photos.length?phGrid(P.photos,'lib'):'<div class="empty" style="margin-top:120px">사진이 없습니다.<br>오른쪽 위 \'추가\'를 눌러 사진이나 동영상을 넣으세요.</div>'}<div style="height:110px"></div></div>${tabs}${phSelBar()}`;
  const smart=[['fav','즐겨찾는 항목',P.photos.filter(p=>p.fav)],['vid','동영상',P.photos.filter(p=>isVid(p.src))]];
  const cv=l=>l.length?mediaTag(l[l.length-1].src):'';
  return topPad+`<div class="nav"><span></span><div class="navr"><button class="nb" onclick="X.albAdd()">${G.plus}</button></div></div><div class="scroll"><div class="large">앨범</div><div class="albums">${P.albums.map(a=>{const l=phList(a.id);return `<button onclick="push('album',{id:'${a.id}'})"><div class="cv">${cv(l)}</div><div style="font-size:15px">${esc(a.name)}</div><div class="t2" style="font-size:14px">${l.length}</div></button>`}).join('')}</div><div class="large" style="font-size:22px;margin-top:20px">미디어 유형</div><div class="grp">${smart.map(([k,n,l])=>`<button class="row" onclick="push('album',{id:'${k}'})"><div class="bd" style="flex-direction:row;justify-content:space-between"><span style="color:var(--blue)">${n}</span><span class="t2">${l.length} ›</span></div></button>`).join('')}</div><div style="height:110px"></div></div>${tabs}`},
 album(p){const A=APPS.photos;const al=byId(P.albums,p.id);const name=al?al.name:p.id==='fav'?'즐겨찾는 항목':'동영상';const l=phList(p.id);
  return topPad+navBar({backLabel:'앨범',title:name,right:`${al?`<button class="nb" onclick="X.albMenu('${al.id}')">${G.dots}</button>`:''}<button class="nb" onclick="X.phSel()">${A.selMode?'취소':'선택'}</button>`})+`<div class="scroll">${l.length?phGrid(l,p.id):'<div class="empty">항목이 없습니다.</div>'}<div style="height:90px"></div></div>${phSelBar()}`}
},after(v,p,keep){if(v==='main'&&APPS.photos.tab==='lib'&&!keep){const s=$('#phs');if(s)s.scrollTop=s.scrollHeight}}};
X.phFind=async()=>{const q=await promptBox('사진 검색','설명이나 날짜(예: 2025-12)로 찾기');if(!q)return;const l=P.photos.filter(p=>(p.desc||'').includes(q)||(p.date||'').includes(q));if(!l.length){toast('찾는 사진이 없어요');return}openViewer(l.map(p=>p.src),0,l.map(p=>p.id))};
/* 전체 화면 보기: 넘기기 · 두 손가락 확대 · 두 번 탭 확대 */
function openViewer(srcs,idx,ids){$('#viewer')?.remove();const v=document.createElement('div');v.id='viewer';$('#phone').appendChild(v);let i=Math.max(0,idx);let sc=1,tx=0,ty=0;
 const draw=()=>{const id=ids&&ids[i];const p=id&&byId(P.photos,id);const src=srcs[i];
  v.innerHTML=`<div class="vtop"><button class="vbtn" data-a="x">${G.back}</button><div class="vt">${p?`${esc(kday(p.date))}<small>${hm(p.date)}</small>`:`${i+1} / ${srcs.length}`}</div><span style="width:40px"></span></div><div class="vstage">${isVid(src)?`<video src="${esc(murl(src))}" controls playsinline autoplay></video>`:`<img src="${esc(murl(src))}" alt="">`}</div>${p&&p.desc?`<div class="vdesc">${esc(p.desc)}</div>`:''}${p?`<div class="vbot"><button class="vbtn" data-a="sh">${G.share}</button><button class="vbtn" data-a="fav" style="${p.fav?'color:#ff2d55':''}">${p.fav?G.heartf:G.heart}</button><button class="vbtn" data-a="info"><b style="font-family:Georgia,serif;font-style:italic">i</b></button><button class="vbtn" data-a="del">${G.trash}</button></div>`:''}`;
  sc=1;tx=0;ty=0;apply();bind()};
 const media=()=>v.querySelector('.vstage>*');const apply=()=>{const m=media();if(m)m.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${sc})`};
 const go=d=>{const j=i+d;if(j<0||j>=srcs.length)return;i=j;draw()};
 function bind(){v.querySelectorAll('[data-a]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const a=b.dataset.a;const p=ids&&byId(P.photos,ids[i]);
  if(a==='x'){v.remove();inkBars();return}
  if(a==='fav'){p.fav=!p.fav;save();draw();return}
  if(a==='info'){sheetForm({title:'사진 정보',fields:phFields(),data:p,onSave:d=>{Object.assign(p,d);srcs[i]=p.src;setTimeout(draw,50)},onDelete:()=>{P.photos.splice(P.photos.indexOf(p),1);v.remove()}});return}
  if(a==='sh'){actionSheet('',[{label:'메시지로 보내기',fn:()=>actionSheet('누구에게?',P.sms.map(t=>({label:smsName(t),fn:()=>{t.msgs.push({id:uid(),from:'me',type:isVid(p.src)?'video':'image',media:p.src,text:'',date:nowS()});save();toast('보냈어요')}})))},{label:'톡으로 보내기',fn:()=>actionSheet('채팅방',P.talk.rooms.map(r=>({label:roomName(r),fn:()=>{r.msgs.push({id:uid(),from:'me',type:isVid(p.src)?'video':'image',media:p.src,text:'',date:nowS()});save();toast('보냈어요')}})))},{label:`${P.apps.insta.name} 게시물로 올리기`,fn:()=>{v.remove();X.igNewPost([p.src])}},{label:'배경화면으로 지정',fn:()=>{P.wallpaper=p.src;save();renderHome();toast('배경화면을 바꿨어요')}}]);return}
  if(a==='del'){if(await confirmBox('이 사진을 삭제할까요?','','삭제',true)){P.photos.splice(P.photos.indexOf(p),1);ids.splice(i,1);srcs.splice(i,1);save();refresh();if(!srcs.length){v.remove();return}i=Math.min(i,srcs.length-1);draw()}}});
  const st=v.querySelector('.vstage');let t0=null,d0=0,s0=1,last=0,mx=0,my=0;
  st.ontouchstart=e=>{if(e.touches.length===2){d0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);s0=sc}else{t0={x:e.touches[0].clientX,y:e.touches[0].clientY,tx,ty,t:Date.now()}}};
  st.ontouchmove=e=>{e.preventDefault();if(e.touches.length===2&&d0){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc=Math.min(5,Math.max(1,s0*d/d0));apply()}else if(t0&&e.touches.length===1){mx=e.touches[0].clientX-t0.x;my=e.touches[0].clientY-t0.y;if(sc>1){tx=t0.tx+mx;ty=t0.ty+my;apply()}}};
  st.ontouchend=e=>{if(d0&&e.touches.length<2){d0=0;if(sc<1.05){sc=1;tx=0;ty=0;apply()}t0=null;return}if(!t0)return;const dt=Date.now()-t0.t;
   if(sc===1&&Math.abs(mx)>60&&Math.abs(mx)>Math.abs(my))go(mx<0?1:-1);
   else if(sc===1&&my>120&&Math.abs(my)>Math.abs(mx)){v.remove();inkBars()}
   else if(Math.abs(mx)<8&&Math.abs(my)<8&&dt<250){const now=Date.now();if(now-last<300){sc=sc>1?1:2.5;tx=0;ty=0;apply();last=0}else{last=now;setTimeout(()=>{if(last===now)v.classList.toggle('hide')},300)}}
   mx=my=0;t0=null};
  st.onclick=e=>{if(e.pointerType==='mouse'||!('ontouchstart' in window)){const r=st.getBoundingClientRect();const x=e.clientX-r.left;if(x<r.width*.25)go(-1);else if(x>r.width*.75)go(1);else v.classList.toggle('hide')}};
 }
 draw();$('#status').style.color='#fff'}
